function buildGlossary() {
  const terms = [
    ["ACA", "Affordable Care Act. The federal health insurance law often called Obamacare. Becerra defended it in court as attorney general."],
    ["Bond", "Money the state borrows from investors and repays with interest over many years. A general obligation bond is repaid from the state's main budget. A revenue bond is repaid from a specific income stream, such as loan payments."],
    ["CEQA", "California Environmental Quality Act. Requires review of a project's environmental effects before approval and allows lawsuits over that review. Prop 45 would change it."],
    ["Constitutional amendment", "A change to the state constitution. Only voters can approve one, and the Legislature cannot later undo it without another vote."],
    ["DACA", "Deferred Action for Childhood Arrivals. A federal program protecting people brought to the U.S. as children. Becerra led the coalition of states that defended it."],
    ["General Fund", "The state's main account, which pays for schools, health care, prisons, and most other programs."],
    ["HHS", "U.S. Department of Health and Human Services. Becerra served as Secretary from 2021 to 2025."],
    ["ICE", "U.S. Immigration and Customs Enforcement."],
    ["Initiative", "A measure placed on the ballot by voter signatures instead of by the Legislature."],
    ["LAO", "Legislative Analyst's Office. The Legislature's nonpartisan budget analyst. It writes the fiscal analysis of every measure in the official voter guide."],
    ["Medi-Cal", "California's Medicaid program, which provides health coverage for low-income residents."],
    ["PPIC", "Public Policy Institute of California. A nonpartisan research group whose statewide survey is the main public poll of California voters."],
    ["Prop 13", "The 1978 measure capping property taxes and requiring a two-thirds vote for many local taxes. Prop 43 concerns how that two-thirds rule applies."],
    ["Prop 36", "The 2024 measure that increased penalties for certain drug and theft crimes and created a treatment-mandated felony option. Becerra voted for it and says he would fully fund it."],
    ["Rainy day fund", "The state's main budget reserve, formally the Budget Stabilization Account. Prop 2 would double its target size."],
    ["Sanctuary law (SB 54)", "The California Values Act of 2017. It limits how much state and local police can help with federal immigration enforcement. Becerra would keep it; Hilton would overturn it."],
    ["Special tax", "A tax whose money is set aside for a specific purpose, as opposed to a general tax that can pay for anything."],
    ["State spending limit", "A 1979 constitutional cap on how much tax money the state can spend each year, also called the Gann Limit. Props 2 and 41 both touch it."],
    ["Top-two primary", "California's primary format. All candidates appear on one ballot and the top two advance to November, even if they are from the same party."],
    ["Voter's Choice Act", "A state law that lets counties replace neighborhood polling places with vote centers that open days before the election. Many counties use it."]
  ];
  return terms.map(([t, d]) => `<div class="gloss-term"><strong>${t}.</strong> ${d}</div>`).join('');
}

function buildEconContext() {
  let html = '';
  html += `<h1>Economic Context: Supplementary Reference</h1>`;
  html += `<p class="lead">The side-by-side tables on the landing page show what changed between the end of 2024 and fall 2026. This section adds context: why AI investment is a mixed bag, what the key terms mean, and where the data comes from.</p>`;

  html += `<div class="section-kicker">Part A: The AI Question</div>`;
  html += `<h2>Why AI investment is both a positive and a negative</h2>`;
  html += `<p class="lead">Headline economic numbers (GDP, the stock market, venture capital) have been propped up by AI infrastructure investment. But AI's costs to electricity bills, water supplies, land use, and employment are not captured in those same numbers. A fair accounting includes both.</p>`;
  html += `<h3>What AI is adding</h3>`;
  html += `<p>AI data center construction and chip manufacturing have driven hundreds of billions of dollars in investment. That creates construction jobs, generates tax revenue for some host communities, and is a major reason U.S. growth has held up despite headwinds elsewhere. California is the center of it: California firms raised about $366 billion in venture capital in 2026 through August, more than three times the other 49 states combined.</p>`;
  html += `<h3>What AI is costing</h3>`;
  html += `<div class="econ-callout-box"><span class="econ-callout-box-label">Electricity</span>U.S. data centers consume about 4.4% of all U.S. electricity, up from 1.9% in 2018, and could reach 12% by 2028. The national average home electricity price was 18.31 cents per kilowatt-hour in July 2026, up 4.9% in a year. Federal energy analysts attribute rising rates partly to grid spending for data center demand.</div>`;
  html += `<div class="econ-callout-box"><span class="econ-callout-box-label">Water</span>Large data centers can consume up to 5 million gallons of water per day, about as much as a town of 10,000 to 50,000 people.</div>`;
  html += `<div class="econ-callout-box"><span class="econ-callout-box-label">Employment</span>Employers announced 116,175 job cuts attributed to AI from January through August 2026, about 22% of all announced cuts, according to Challenger, Gray &amp; Christmas. Bay Area tech layoff notices through early September were 27% higher than in all of 2025.</div>`;
  html += `<h3>Why this matters for voting</h3>`;
  html += `<p>Different policies push AI's costs onto different groups:</p>`;
  html += `<ul>
    <li><strong>Tax incentives</strong> for data centers shift costs from corporations to residents.</li>
    <li><strong>Utility rate rules</strong> decide whether households subsidize data center power use.</li>
    <li><strong>Worker retraining and unemployment insurance</strong> decide the safety net for people displaced by automation.</li>
    <li><strong>Environmental review</strong> rules, including Prop 45 on this ballot, decide how much scrutiny large projects get.</li>
  </ul>`;
  html += `<p>On AI, Becerra calls for enforcement and audits. Hilton has declined to back specific regulations.</p>`;

  html += `<div class="section-kicker">Part B: Glossary</div>`;
  html += `<h2>Economic terms</h2>`;
  const glossary = [
    ['CPI (Consumer Price Index)', 'The main measure of inflation in the U.S. Tracks the average change in prices for a basket of everyday goods and services: food, gas, rent, medical care, clothing. Published monthly by the Bureau of Labor Statistics.'],
    ['Year over year', 'A comparison between a number today and the same number 12 months ago. "Gas prices up 27% year over year" means gas costs 27% more than it did one year ago.'],
    ['GDP (Gross Domestic Product)', 'The total dollar value of all goods and services produced. Growth of 2 to 3% a year is generally considered healthy.'],
    ['Fed funds rate', 'The interest rate the Federal Reserve sets for banks lending to each other overnight. It influences almost every other interest rate: mortgages, credit cards, car loans. Higher rates cool inflation but slow the economy. The Fed raised it in September 2026.'],
    ['30-year mortgage rate', 'The average interest rate on a 30-year fixed home loan. A 1-point change can mean hundreds of dollars a month in payments.'],
    ['Unemployment rate', 'The percentage of people in the labor force who do not have a job but are looking for one. It does not count people who have stopped looking.'],
    ['Monthly job growth', 'The net number of jobs added each month. 150,000 to 200,000 a month has historically been considered healthy; under 50,000 suggests a weakening labor market.'],
    ['Tariffs', 'Taxes on imported goods. The Supreme Court struck down the emergency-powers tariffs in February 2026.'],
    ['Venture capital', 'Money invested in early-stage or fast-growing companies. When most of it flows to one region, that region captures most new-company formation.'],
    ['Strait of Hormuz', 'A narrow waterway in the Persian Gulf that carries a large share of the world\'s oil. Disruption of shipping during the 2026 U.S.-Iran conflict drove oil and U.S. fuel prices sharply higher.']
  ];
  glossary.forEach(([term, def]) => {
    html += `<div class="econ-glossary-item"><span class="econ-glossary-term">${term}</span><div class="econ-glossary-def">${def}</div></div>`;
  });

  html += `<div class="section-kicker">Part C: Sources and Method</div>`;
  html += `<h2>Where the economic data comes from</h2>`;
  html += `<p>The "Latest 2026" figures were compiled on ${DATA_DATE} and reflect the most recent release for each measure, mostly August 2026. The 2024 column is the end-of-2024 baseline from the original version of this reference.</p>`;
  html += `<ul>
    <li>U.S. Bureau of Labor Statistics (inflation, food prices, unemployment, jobs)</li>
    <li>Freddie Mac Primary Mortgage Market Survey (mortgage rates)</li>
    <li>AAA (gas and diesel prices)</li>
    <li>National Association of Realtors (home prices and sales)</li>
    <li>Federal Reserve (interest rates and projections)</li>
    <li>Bureau of Economic Analysis (GDP)</li>
    <li>U.S. Census Bureau (household income)</li>
    <li>U.S. Energy Information Administration (electricity prices)</li>
    <li>Challenger, Gray &amp; Christmas (announced job cuts)</li>
    <li>American Farm Bureau Federation (farm costs)</li>
    <li>California Employment Development Department (state unemployment and jobs)</li>
    <li>Zillow (California home values)</li>
    <li>Federal Reserve Bank of St. Louis FRED (building permits, state unemployment history)</li>
    <li>California Legislative Analyst's Office (state budget)</li>
  </ul>`;
  html += `<h3>A note on "better" and "worse"</h3>`;
  html += `<p>The labels reflect the effect on household affordability, job availability, and cost of living. Rising home prices are labeled "Worse" because they make homes less affordable for buyers. Rising gas, grocery, or energy prices are labeled "Worse" because they reduce what a paycheck buys.</p>`;
  html += `<h3>What this reference does not cover</h3>`;
  html += `<p>This reference does not assess specific candidates, rank parties, or predict elections. It compares economic indicators at two points in time.</p>`;
  return html;
}
