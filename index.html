<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="supported-color-schemes" content="light">
<title>California 2026 General Election: Governor Matcher and Proposition Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light only; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #ffffff !important;
    color: #111111 !important;
    -webkit-text-fill-color: #111111;
    font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
  }

  @media (prefers-color-scheme: dark) {
    html, body { background: #ffffff !important; color: #111111 !important; -webkit-text-fill-color: #111111; }
  }

  .stage {
    max-width: 680px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  /* INTRO */
  .tag {
    display: inline-block;
    background: #1a1a1a !important;
    color: #ffffff !important;
    -webkit-text-fill-color: #ffffff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    padding: 6px 12px;
    text-transform: uppercase;
    border-radius: 3px;
    margin-bottom: 24px;
  }

  h1 {
    font-size: clamp(32px, 7vw, 44px);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
    color: #111 !important;
    -webkit-text-fill-color: #111;
  }

  .lede {
    font-size: 18px;
    color: #444 !important;
    -webkit-text-fill-color: #444;
    margin-bottom: 32px;
    line-height: 1.45;
  }

  .intro-card {
    background: #f7f5f0 !important;
    border: 1px solid #e4e0d6;
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 28px;
  }

  .intro-card h3 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #888 !important;
    -webkit-text-fill-color: #888;
    margin-bottom: 16px;
  }

  .intro-steps {
    list-style: none;
    counter-reset: steps;
  }

  .intro-steps li {
    counter-increment: steps;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 10px 0;
    border-bottom: 1px solid #e4e0d6;
    font-size: 15px;
    line-height: 1.4;
    color: #222 !important;
    -webkit-text-fill-color: #222;
  }
  .intro-steps li:last-child { border-bottom: none; }
  .intro-steps li::before {
    content: counter(steps);
    background: #111 !important;
    color: #fff !important;
    -webkit-text-fill-color: #fff;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat {
    background: #fff !important;
    border: 1px solid #e4e0d6;
    border-radius: 6px;
    padding: 14px 10px;
    text-align: center;
  }
  .stat-num {
    font-size: 22px;
    font-weight: 700;
    color: #111 !important;
    -webkit-text-fill-color: #111;
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-label {
    font-size: 11px;
    color: #666 !important;
    -webkit-text-fill-color: #666;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .cta-wrap {
    text-align: center;
    padding: 12px 0;
  }

  .cta {
    display: block;
    width: 100%;
    background: #c8321a !important;
    color: #ffffff !important;
    -webkit-text-fill-color: #ffffff !important;
    border: none;
    font-family: inherit;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.01em;
    padding: 18px 24px;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 2px 0 #8a1f0c;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .cta:hover, .cta:focus { background: #b02816 !important; }
  .cta:active { transform: translateY(2px); box-shadow: 0 0 0 #8a1f0c; }

  .hint {
    font-size: 13px;
    color: #666 !important;
    -webkit-text-fill-color: #666;
    margin-top: 12px;
    font-style: italic;
  }

  .disclaimer {
    margin-top: 28px;
    padding: 14px 16px;
    background: #fffaf0 !important;
    border-left: 3px solid #c8321a;
    border-radius: 4px;
    font-size: 13px;
    line-height: 1.5;
    color: #444 !important;
    -webkit-text-fill-color: #444;
  }
  .disclaimer strong { color: #111 !important; -webkit-text-fill-color: #111; }

  .resources {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .resource-link {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: #faf7f0 !important;
    border: 1px solid #e3ddc9;
    border-left: 3px solid #c8321a;
    border-radius: 4px;
    text-decoration: none;
    color: inherit;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    text-align: left;
    width: 100%;
  }
  .resource-link:hover, .resource-link:active {
    background: #f3eedc !important;
  }
  .resource-label {
    color: #2a251e !important;
    -webkit-text-fill-color: #2a251e;
    font-weight: 500;
  }
  .resource-host {
    color: #c8321a !important;
    -webkit-text-fill-color: #c8321a;
    font-size: 12px;
    white-space: nowrap;
    margin-left: 12px;
  }
  .prompt-body {
    margin-top: -4px;
    padding: 16px 18px;
    background: #faf7f0 !important;
    border: 1px solid #e3ddc9;
    border-radius: 4px;
    font-size: 13px;
    line-height: 1.55;
  }
  .prompt-intro {
    margin: 0 0 12px;
    color: #5a544a !important;
    -webkit-text-fill-color: #5a544a;
  }
  .prompt-text {
    background: #fff !important;
    border: 1px solid #e3ddc9;
    border-radius: 4px;
    padding: 12px 14px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.5;
    color: #2a251e !important;
    -webkit-text-fill-color: #2a251e;
    white-space: pre-wrap;
    word-wrap: break-word;
    max-height: 360px;
    overflow-y: auto;
    margin: 0 0 12px;
  }
  .prompt-copy {
    background: #c8321a !important;
    color: #fff !important;
    -webkit-text-fill-color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .prompt-copy:hover, .prompt-copy:active {
    background: #a82914 !important;
  }

  .data-banner {
    padding: 10px 14px;
    background: #fef5f2 !important;
    border-left: 3px solid #c8441c;
    border-radius: 4px;
    margin-bottom: 20px;
    font-size: 13px;
    line-height: 1.5;
    color: #4a2a20 !important;
    -webkit-text-fill-color: #4a2a20;
  }
  .data-banner strong {
    color: #8a2010 !important;
    -webkit-text-fill-color: #8a2010;
    font-weight: 700;
  }
  .data-banner a {
    color: #8a2010 !important;
    -webkit-text-fill-color: #8a2010;
    text-decoration: underline;
  }

  /* ==================== ECONOMIC CONTEXT CALLOUT ==================== */
  .econ-callout {
    background: #faf7f0 !important;
    border: 1px solid #2a251e;
    padding: 20px;
    margin: 24px 0;
  }
  .econ-callout-kicker {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #8b2e1f !important;
    -webkit-text-fill-color: #8b2e1f;
    margin-bottom: 6px;
  }
  .econ-callout-title {
    font-size: 18px;
    font-weight: 700;
    color: #1a1814 !important;
    -webkit-text-fill-color: #1a1814;
    margin-bottom: 10px;
    line-height: 1.25;
  }
  .econ-callout-lead {
    font-size: 14px;
    color: #3a352e !important;
    -webkit-text-fill-color: #3a352e;
    line-height: 1.5;
    margin-bottom: 14px;
  }
  .econ-tables-grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 6px;
  }
  .econ-table-wrap {
    background: #f0ebdc !important;
    border: 1px solid #2a251e;
    display: flex;
    flex-direction: column;
  }
  .econ-table-label {
    background: #1a1814 !important;
    color: #faf7f0 !important;
    -webkit-text-fill-color: #faf7f0;
    padding: 8px 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .econ-table-scroll {
    max-height: 280px;
    overflow-y: auto;
    background: #faf7f0 !important;
  }
  .econ-table-scroll::-webkit-scrollbar { width: 8px; }
  .econ-table-scroll::-webkit-scrollbar-track { background: #f0ebdc; }
  .econ-table-scroll::-webkit-scrollbar-thumb { background: #2a251e; border-radius: 0; }
  .econ-mini-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    table-layout: fixed;
  }
  .econ-mini-table thead {
    position: sticky;
    top: 0;
    z-index: 1;
  }
  .econ-mini-table th {
    background: #1a1814 !important;
    color: #faf7f0 !important;
    -webkit-text-fill-color: #faf7f0;
    padding: 6px 6px;
    text-align: left;
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .econ-mini-table th:nth-child(1) { width: 30%; }
  .econ-mini-table th:nth-child(2) { width: 22%; }
  .econ-mini-table th:nth-child(3) { width: 28%; }
  .econ-mini-table th:nth-child(4) { width: 20%; }
  .econ-mini-table td {
    padding: 6px 6px;
    border-bottom: 1px solid rgba(42,37,30,0.12);
    vertical-align: top;
    color: #2a251e !important;
    -webkit-text-fill-color: #2a251e;
    font-size: 12px;
    line-height: 1.35;
    word-wrap: normal;
    overflow-wrap: normal;
    word-break: normal;
  }
  .econ-mini-table td:first-child {
    font-weight: 600;
    background: rgba(42,37,30,0.04) !important;
  }
  .econ-mini-table td:nth-child(2), .econ-mini-table td:nth-child(3) {
    color: #5a544a !important;
    -webkit-text-fill-color: #5a544a;
  }
  .econ-tag {
    font-size: 9px !important;
    padding: 2px 4px !important;
    letter-spacing: 0.02em !important;
  }
  .econ-table-foot {
    padding: 8px 12px;
    font-size: 11px;
    line-height: 1.45;
    color: #2a251e !important;
    -webkit-text-fill-color: #2a251e;
    background: #e5e1d6 !important;
    border-top: 1px solid #2a251e;
  }
  .econ-table-foot strong { color: #1a1814 !important; -webkit-text-fill-color: #1a1814; }

  /* ==================== ECONOMIC OVERLAY ==================== */
  .econ-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #faf7f0 !important;
    z-index: 1000;
    display: none;
    overflow-y: auto;
  }
  .econ-overlay.open { display: block; }
  .econ-top {
    position: sticky;
    top: 0;
    background: #faf7f0 !important;
    border-bottom: 1px solid #2a251e;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }
  .econ-top-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #8b2e1f !important;
    -webkit-text-fill-color: #8b2e1f;
  }
  .econ-close {
    background: #1a1814 !important;
    color: #faf7f0 !important;
    -webkit-text-fill-color: #faf7f0;
    border: none;
    padding: 8px 16px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    border-radius: 4px;
    cursor: pointer;
  }
  .econ-content {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }
  .econ-content h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 12px;
    color: #1a1814 !important;
    -webkit-text-fill-color: #1a1814;
    line-height: 1.15;
  }
  .econ-content h2 {
    font-size: 20px;
    font-weight: 700;
    margin-top: 36px;
    margin-bottom: 12px;
    color: #8b2e1f !important;
    -webkit-text-fill-color: #8b2e1f;
    padding-bottom: 6px;
    border-bottom: 2px solid #8b2e1f;
  }
  .econ-content h3 {
    font-size: 16px;
    font-weight: 700;
    margin-top: 24px;
    margin-bottom: 10px;
    color: #1a1814 !important;
    -webkit-text-fill-color: #1a1814;
  }
  .econ-content .section-kicker {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: #8b2e1f !important;
    -webkit-text-fill-color: #8b2e1f;
    margin-top: 36px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .econ-content p {
    font-size: 15px;
    line-height: 1.6;
    color: #2a251e !important;
    -webkit-text-fill-color: #2a251e;
    margin-bottom: 14px;
  }
  .econ-content p.lead {
    font-size: 17px;
    font-weight: 400;
    color: #1a1814 !important;
    -webkit-text-fill-color: #1a1814;
  }
  .econ-content ul {
    padding-left: 20px;
    margin-bottom: 16px;
  }
  .econ-content ul li {
    font-size: 15px;
    line-height: 1.6;
    color: #2a251e !important;
    -webkit-text-fill-color: #2a251e;
    margin-bottom: 6px;
  }
  .econ-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin: 16px 0;
    border: 1px solid #2a251e;
    background: #f0ebdc !important;
  }
  .econ-table th {
    background: #1a1814 !important;
    color: #faf7f0 !important;
    -webkit-text-fill-color: #faf7f0;
    padding: 10px 8px;
    text-align: left;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .econ-table th small {
    display: block;
    font-size: 9px;
    opacity: 0.75;
    letter-spacing: 0;
    text-transform: none;
    font-weight: 400;
    margin-top: 2px;
  }
  .econ-table td {
    padding: 9px 8px;
    border-bottom: 1px solid rgba(42,37,30,0.12);
    vertical-align: top;
    color: #2a251e !important;
    -webkit-text-fill-color: #2a251e;
  }
  .econ-table td:first-child {
    font-weight: 600;
    background: rgba(42,37,30,0.04) !important;
    font-size: 13px;
  }
  .econ-tag {
    display: inline-block;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 600;
    border-radius: 2px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .econ-tag-worse { background: #f4d9d3 !important; color: #8b2e1f !important; -webkit-text-fill-color: #8b2e1f; }
  .econ-tag-better { background: #d4e8d9 !important; color: #2d5a3d !important; -webkit-text-fill-color: #2d5a3d; }
  .econ-tag-neutral { background: #e5e1d6 !important; color: #5a544a !important; -webkit-text-fill-color: #5a544a; }
  .econ-callout-box {
    background: #f0ebdc !important;
    border-left: 3px solid #8b2e1f;
    padding: 12px 14px;
    margin: 12px 0;
    font-size: 14px;
    line-height: 1.55;
  }
  .econ-callout-box-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #8b2e1f !important;
    -webkit-text-fill-color: #8b2e1f;
    display: block;
    margin-bottom: 4px;
  }
  .econ-scorecard {
    background: #1a1814 !important;
    color: #faf7f0 !important;
    -webkit-text-fill-color: #faf7f0;
    padding: 14px 16px;
    font-size: 14px;
    margin: 12px 0 20px;
  }
  .econ-scorecard strong { color: #faf7f0 !important; -webkit-text-fill-color: #faf7f0; }
  .econ-glossary-item {
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(42,37,30,0.12);
  }
  .econ-glossary-item:last-child { border-bottom: none; }
  .econ-glossary-term {
    font-size: 14px;
    font-weight: 700;
    color: #8b2e1f !important;
    -webkit-text-fill-color: #8b2e1f;
    display: block;
    margin-bottom: 3px;
  }
  .econ-glossary-def {
    font-size: 13px;
    line-height: 1.5;
    color: #2a251e !important;
    -webkit-text-fill-color: #2a251e;
  }

  /* ==========================================================
     BRIEFING: full-screen overlay
     ========================================================== */
  .briefing-link-row {
    margin-top: 16px;
    text-align: center;
  }
  .briefing-link {
    display: inline-block;
    background: transparent !important;
    color: #c8441c !important;
    -webkit-text-fill-color: #c8441c;
    border: none;
    font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    padding: 10px 4px;
    text-decoration: underline;
    text-underline-offset: 4px;
    -webkit-appearance: none;
    appearance: none;
  }
  .briefing-link:hover, .briefing-link:active {
    color: #a0361a !important;
    -webkit-text-fill-color: #a0361a;
  }

  /* Prominent briefing CTA on result page */
  .briefing-cta {
    margin: 32px 0 20px;
    padding: 20px 22px;
    background: #f7f6f3 !important;
    border: 1px solid #1a1a1a;
    text-align: center;
  }
  .briefing-cta-btn {
    display: inline-block;
    background: #1a1a1a !important;
    color: #ffffff !important;
    -webkit-text-fill-color: #ffffff;
    border: none;
    font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 14px 28px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    transition: background-color 0.15s;
  }
  .briefing-cta-btn:hover, .briefing-cta-btn:active {
    background: #c8441c !important;
  }
  .briefing-cta-hint {
    margin-top: 12px;
    font-size: 13px;
    font-style: italic;
    color: #6a6a67 !important;
    -webkit-text-fill-color: #6a6a67;
  }

  .briefing-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #ffffff !important;
    z-index: 10000;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .briefing-overlay.open { display: block; }
  .briefing-topbar {
    position: sticky;
    top: 0;
    background: #ffffff !important;
    border-bottom: 1px solid #e5e3de;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }
  .briefing-topbar-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #111 !important;
    -webkit-text-fill-color: #111;
  }
  .briefing-close {
    background: transparent !important;
    border: 1px solid #111;
    color: #111 !important;
    -webkit-text-fill-color: #111;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .briefing-close:hover, .briefing-close:active {
    background: #111 !important;
    color: #fff !important;
    -webkit-text-fill-color: #fff;
  }
  .briefing-stage {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }
  .briefing-stage h2.b-h1 {
    font-size: clamp(24px, 5vw, 30px);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: #111 !important;
    -webkit-text-fill-color: #111;
    margin: 28px 0 12px;
    padding-bottom: 10px;
    border-bottom: 2px solid #111;

    against: "Reform California, the California Republican Party, and legislative Republicans. They say taking deposits out of the spending limit makes taxpayer rebates less likely.",
    poll: "60% yes, 39% no", gov: "Becerra: Yes. Hilton: no public position found." },
  { num: 3, name: "Make the high-income tax permanent", official: "Provides Permanent Funding for Schools and Health Care by Extending Existing Tax on High Incomes. Initiative Constitutional Amendment.",
    money: "Yes side: about $46 million as of October 6, almost all from the California Teachers Association, which wrote the measure ($43.8 million), plus the National Education Association ($7.5 million) and other public-sector unions whose members are paid from this revenue. No side: $5,500, from the Family Business Association and one company.",
    also: [
      "<b>Most of the money does not add to school budgets.</b> The revenue goes into a school account that also counts toward the state's existing school funding guarantee, so it frees up regular budget money for other uses. The state's budget analyst estimates only about 40% nets out to schools; the rest goes to other state programs. The Budget Center says the health care formula \"has never directed funds to Medi-Cal\" and supports it only indirectly.",
      "<b>No expiration date, and it is a constitutional amendment.</b> Changing the rates later would take another statewide vote. The rates start at about $371,000 for a single filer and $743,000 for a couple, now adjusted for inflation.",
      "<b>Who pays:</b> the top 2% of filers, who already pay about half of all state income tax. The revenue swings from about $5 billion in a weak stock market year to $15 billion in a strong one, which critics say deepens the state's dependence on its most volatile revenue source and hits small businesses that file as individuals.",
      "<b>Supporters' answer:</b> nobody's taxes go up; the rates already exist. Letting them expire would mean up to $15 billion a year in cuts and layoffs."
    ],
    what: "Makes permanent the higher income tax rates on top earners that voters approved in 2012 and extended in 2016. Without this measure they expire in <b>2031</b>. The top 2% of taxpayers pay these rates; the official guide puts the starting point at individual income over $371,000. The state's budget analyst says roughly 40% of the money goes to schools and community colleges and the rest to other state programs.",
    yes: "The income tax increase on high earners in place since 2012 would become permanent.",
    no: "That tax increase would expire in 2031.",
    cost: "Keeps $5 billion to $15 billion a year in state revenue, depending on the stock market.",
    forWho: "California Teachers Association (sponsor), California State PTA, Planned Parenthood Affiliates of California, California Medical Association, California Democratic Party. They say it keeps rates the top 2% already pay and prevents school cuts.",
    against: "California Taxpayers Association, Family Business Association of California, California Hispanic Chambers of Commerce, Reform California. They say it turns a temporary tax into a permanent one and could push high earners and jobs out of state.",
    poll: "58% yes, 40% no", gov: "Becerra: Yes. Hilton: no public position found." },
  { num: 4, name: "Allow public funding of campaigns", official: "Repeals Prohibition Against Public Funding of Election Campaigns. Legislative Statute.",
    money: "Yes side: $235,000 as of October 6, all from Movement Voter PAC, a national progressive donor network. No side: no committee and no money reported.",
    also: [
      "<b>It creates no program and spends no money by itself.</b> It only lets the state, counties, and cities set up public financing later. Charter cities like Los Angeles and San Francisco already have programs under a 1992 court ruling. Los Angeles's program is budgeted at about $15 million for the current two-year cycle.",
      "<b>The cost is decided later and is open-ended.</b> The state's budget analyst says costs \"could be significant\" for any government that creates a program. The ban on using money earmarked for education, transportation, or public safety does not cover general fund money, which the California Taxpayers Association calls the real concern.",
      "<b>A rider:</b> it also triples the maximum fine for illegal campaign donations from foreign entities.",
      "<b>Design risk:</b> the Hoover Institution notes that depending on how a program is written, its qualifying rules could favor incumbents or well-organized candidates, and that evidence public financing reduces big-donor influence is mixed. Candidates could take public money and private donations at the same time."
    ],
    what: "Repeals California's 1988 ban on using public money for candidates' campaigns. State and local governments could then set up public financing programs. It does not create any program by itself. Candidates who take part would have to show broad support and accept spending limits, and money set aside for education, transportation, or public safety could not be used.",
    yes: "State and local governments could create public campaign financing programs, with limits on which funds are used and who can receive them.",
    no: "The state and most local governments would still be unable to create these programs.",
    cost: "A few hundred thousand dollars a year for the state's campaign watchdog to answer questions.",
    forWho: "California Common Cause, League of Women Voters, California Clean Money Campaign, California Democratic Party. They say it reduces the pull of big donors.",
    against: "California Taxpayers Association, Reform California, California Republican Party. They say it lets politicians spend taxpayer money on campaigns, with no cap on the amount.",
    poll: "42% yes, 53% no", gov: "Neither candidate has a public position that we could find." },
  { num: 5, name: "Change how recalls work", official: "Changes Recall Election Process for Statewide Officers. Legislative Constitutional Amendment.",
    money: "No committee and no money reported on either side.",
    also: [
      "<b>A recalled governor could be replaced by the lieutenant governor for the rest of the term</b> with no election, if the recall happens after the filing deadline for the next statewide election in the first two years of the term. Opponents point out the replacement would likely be from the same party.",
      "<b>Other recalled statewide officers would be replaced by the governor's appointment,</b> the same way vacancies are filled now. Recalled legislators would be replaced by special election, which costs millions.",
      "<b>The recalled official could run again</b> for the same seat in the next election, though they could not be appointed to it. Today a recalled official is barred from running.",
      "<b>The author was himself recalled.</b> Senator Josh Newman wrote it after being recalled from his seat in 2018. The idea came from the Secretary of State's office after the failed 2021 Newsom recall, where 46 replacement candidates were on the ballot."
    ],
    what: "Recall ballots would ask only one question: should this official be removed? The second question, who should replace them, goes away. If a governor is recalled, the lieutenant governor would act as governor until a special election or the end of the term. Other vacancies would be filled by special election or appointment.",
    yes: "Recall elections would no longer ask who should fill the vacancy. Vacancies would be filled by special election or appointment.",
    no: "Voters would keep choosing a replacement on the recall ballot.",
    cost: "Unknown. A recall could cost or save millions depending on the office.",
    forWho: "League of Women Voters of California, California Common Cause, California Democratic Party, the Sacramento Bee. They say it keeps a replacement from winning with a small share of the vote.",
    against: "California Republican Party, Election Integrity Project California, Reform California. They say it takes away voters' right to pick the replacement.",
    poll: "35% yes, 59% no", gov: "Neither candidate has a public position that we could find." },
  { num: 37, name: "Loans for middle-income buyers of new homes", official: "Creates Loan Program for Middle-Income Buyers of Qualified New Homes. Initiative Statute.",
    money: "Yes side: about $19.6 million as of October 6. About three-quarters comes from the California Association of Realtors and its national parent ($16 million). Also Building a Better California, the Sergey Brin and Eric Schmidt committee ($6 million), carpenters' unions ($1.7 million), and California Forever, the company proposing a new city in Solano County ($50,000). No side: no committee and no money reported.",
    also: [
      "<b>Every buyer must hire a licensed California real estate agent or broker.</b> That is written into the measure, and the realtors' association is its main funder.",
      "<b>Builders who join the program get weaker construction-defect rules.</b> Defect claims would need each homeowner's signature naming each defect, builders could contact homeowners directly, and contingency attorney fees would be capped at 30%. The state's budget analyst says the changes \"aim to provide more flexibility to developers.\"",
      "<b>Program homes are declared not to be public works,</b> so prevailing wage rules do not apply, even though the state is financing them.",
      "<b>\"Middle income\" reaches twice the local median and there is no first-time-buyer rule.</b> A family of four could qualify earning up to about $375,800 in Santa Clara County. The Budget Center says benefits would likely skew toward the top of that range. The state gets no share of the home's appreciation.",
      "<b>It is a second mortgage with monthly payments, not a grant,</b> at an interest rate set after the election. Because the loans must repay the bonds, the Budget Center says the rate could run above first-mortgage rates and offset much of the benefit. Hoover warns that subsidizing demand for limited new homes could raise prices and shift the benefit to sellers and builders."
    ],
    what: "Creates a state second-mortgage program funded by up to <b>$25 billion</b> in revenue bonds. The loan covers up to 17% of the price of a newly built home; the buyer puts down at least 3%. Buyers must be California residents earning no more than twice the typical income in their area, and the home must cost under about $1.5 million.",
    yes: "The state would create the new homebuying program and could sell up to $25 billion in bonds, repaid from homeowners' loan payments.",
    no: "The state would not be required to create the program.",
    cost: "No direct state or local cost, according to the state's budget analyst. Homeowners' payments repay the bonds.",
    forWho: "California Conference of Carpenters, United Nurses Associations of California, State Treasurer Fiona Ma, California Association of Realtors, California Teachers Association, California Democratic Party. They say it helps buyers who can't save a full down payment, at no cost to taxpayers.",
    against: "No argument against was filed in the official guide. Reform California, the League of Women Voters, and Assemblymember Carl DeMaio oppose it. They say the state should not be a mortgage lender and that it adds debt for buyers without lowering what homes cost.",
    poll: "61% yes, 35% no", gov: "Becerra: Yes. Hilton: no public position found." },
  { num: 38, name: "Immunology research bond", official: "Authorizes Bonds for Immunology Medical Research. Initiative Statute.",
    money: "Yes side: about $64 million as of October 6, almost all from one person: Dr. Gary Michelson, a billionaire spinal surgery inventor, directly and through his nonprofit ($61 million), plus $5 million from Meyer Luskin. Both co-founded the institute positioned to receive half the money. No side: under $10,000, mostly from Stanford professor Robert Kaplan and a few individuals.",
    also: [
      "<b>Half the money, about $4.2 billion, goes to one unnamed institute whose criteria fit exactly one place:</b> the California Institute for Immunology and Immunotherapy at UCLA. The measure requires a nonprofit founded before 2025 with 200,000 square feet, $250 million in philanthropy, two specific $50 million gifts, and ties to a UC medical center with over 3.5 million outpatient visits. UCLA confirmed only that institute qualifies. Michelson is its co-founder and board chair.",
      "<b>If no institute qualifies, the Department of Public Health can adjust the criteria to pick one.</b> The institute already received $200 million from the state budget.",
      "<b>The other half is awarded by a council whose members are the only eligible applicants.</b> Grants can go only to universities and nonprofits represented on the council, the council must confer with the institute on awards, and grantees must give the institute and UCLA a role in clinical trials.",
      "<b>\"Pays for itself\" rests on 10% of future licensing revenue,</b> which the state's budget analyst calls uncertain and says may take decades to offset the $500 million to $600 million a year in debt payments. The 20% price discount for Californians could, per opponents, push companies to sell new products in other states first.",
      "<b>Supporters' answer:</b> the criteria ensure the institute can start research immediately, for-profits cannot receive grants, and federal research funding is being cut. A separate $7.5 billion research bond is already set for the March 2028 ballot."
    ],
    what: "Lets the state borrow <b>$8.4 billion</b> for research on immune-system treatments. About half goes to a single University of California-affiliated nonprofit institute and half to competitive grants. At least $4.2 billion is set aside for cancer, heart disease, and Alzheimer's research. The state would get 10% of revenue from discoveries.",
    yes: "The state could borrow $8.4 billion for immunology and immunotherapy research at California institutes and universities.",
    no: "The state could not borrow that money.",
    cost: "About $500 million to $600 million a year for about 20 years, offset if the research brings in revenue.",
    forWho: "Michael J. Fox Foundation, Alzheimer's Los Angeles, American Nurses Association/California, City of Hope, California Democratic Party. Funded mainly by Dr. Gary Michelson. They say federal research money is being cut and the measure is built to pay for itself.",
    against: "Stanford professor Robert Kaplan, League of Women Voters of California, Howard Jarvis Taxpayers Association, Courage California, the Orange County Register. They say it commits decades of debt, steers half the money to one institution, and skips normal scientific review.",
    poll: "55% yes, 42% no", gov: "Neither candidate has a public position that we could find." },
  { num: 39, name: "Voter ID", official: "Prohibits Citizens from Voting Unless They Present Government-Issued Identification. Initiative Constitutional Amendment.",
    money: "Yes side: about $36 million through mid-October. Two out-of-state billionaires supply most of it: Richard Uihlein of Wisconsin, co-founder of Uline and a major Republican donor ($17 million), and Joe Gebbia of Texas, Airbnb co-founder and now White House Chief Design Officer ($8 million). Also Carl DeMaio's Reform California, mostly small donors ($3.1 million), and tech investors including Nicole Shanahan, Douglas Leone, and the Winklevoss twins. No side: about $32 million, from the California Democratic Party (about $5.5 million), the teachers', SEIU, and nurses' unions, two tribal governments ($2.5 million), trial lawyers ($1 million), Reed Hastings and Patty Quillin ($2.5 million), the ACLU, and dialysis company DaVita ($600,000).",
    also: [
      "<b>The big change is to mail voting,</b> which is how about 13 million of 16 million Californians voted in 2024. Every mail voter would have to write the last four digits of a government ID on the envelope, and a ballot with a missing or wrong number would not count. Today the signature serves that purpose. The measure describes no process to fix a mistake, and opponents say voters who never designate an ID may not get a mail ballot at all.",
      "<b>The Legislature fills in the blanks.</b> Which IDs count and what \"best efforts\" to verify citizenship means are left to future laws. Counties would have to report annually what share of voters have had citizenship verified, with state audits every two years.",
      "<b>It is a constitutional amendment with no expiration</b> and applies to every election in California. Cost: tens of millions to low hundreds of millions of dollars a year. The free voter ID card is free to order, but opponents note travel, time off, and document fees are not.",
      "<b>A judge upheld the ballot title</b> that begins \"Prohibits citizens from voting unless they present government-issued identification,\" and a separate ruling struck the campaign's pamphlet claims that it would save money and make voting easier.",
      "<b>Supporters' answer:</b> mail voting stays, the ID is free, more than 100,000 ballots were rejected for signature mismatches under the current system, and states with voter ID have not seen turnout drop. DeMaio says he never solicited Uihlein's money."
    ],
    what: "In-person voters would have to show government-issued ID. Mail voters would have to write the last four digits of a government ID number on the ballot envelope, and ballots without it would not count. Election officials would have to work to verify that registered voters are citizens. The state would provide a free voter ID card on request.",
    yes: "Voters would have to give extra identifying information to election officials each time they vote.",
    no: "A voter's identity would continue to be confirmed with a signature.",
    cost: "Tens of millions to low hundreds of millions of dollars a year.",
    forWho: "California Republican Party, Reform California, Howard Jarvis Taxpayers Association, Assemblymember Carl DeMaio (lead proponent). Major funder: Richard Uihlein. They say ID builds trust in elections and most states require it.",
    against: "ACLU California Action, Common Cause, League of Women Voters of California, California Democratic Party, Secretary of State Shirley Weber, California Labor Federation. They say fraud is extremely rare and the rules could block eligible voters.",
    poll: "43% yes, 55% no", poll2: "An Independent Voter Project poll (September 23 to October 2, 2,906 likely voters) had it at 43% yes, 40% no, 17% undecided. That group sponsored the top-two primary and is an advocacy organization.", gov: "Becerra: No. Hilton: Yes, stated at the CNN debate. Becerra said at the debate that Prop 39 is backed by Donald Trump; the Yes on 39 campaign says Trump has taken no position." },
  { num: 40, name: "One-time tax on billionaires", official: "Imposes One-Time Tax on Certain Taxpayers. Initiative Constitutional Amendment and Statute.",
    money: "Yes side: about $32 million, almost all from one union, SEIU-United Healthcare Workers West, which wrote the measure ($31.8 million). Small donors had given about $3,600 combined as of June. No side: about $100 million through October 6 and more than $200 million by mid-October per CalMatters, nearly all routed through one committee, Building a Better California, funded by tech and venture billionaires: Google co-founder Sergey Brin (over $120 million, nearly a third of all No money), John Doerr, Eric Schmidt, Patrick Collison, Chris Larsen, Michael Moritz, and Vinod Khosla. Opponents have spent or booked about $96 million in ads to supporters' $209,000. Doctor, clinic, and business groups gave smaller amounts.",
    also: [
      "<b>Residency is frozen at January 1, 2026.</b> Anyone who was a California resident that day owes the tax, even if they have moved since. Sergey Brin and Larry Page moved to Nevada before that date. One tax attorney told CalMatters the rule may be unconstitutionally retroactive; the drafters disagree.",
      "<b>What is left out of net worth:</b> directly owned real estate, pensions and traditional retirement accounts, Roth accounts up to $10 million, and up to $5 million of art, cars, and personal items. Private companies are valued by a formula tied to their last fundraising round rather than IRS fair market value. The rate phases in from 0% at $1 billion to 5% at $1.1 billion. Every income tax filer in the state would have to declare whether their net worth tops $1 billion.",
      "<b>The Legislature decides how the money is spent</b> within the 90% health and 10% education and food categories. Nothing requires it to replace federal Medi-Cal cuts specifically. The California Medical Association and Planned Parenthood warn the money could backfill state cuts and free up general fund dollars for other things. The revenue is exempt from the school funding guarantee, the state spending limit, and reserve rules. The Legislature can amend the measure by two-thirds vote.",
      "<b>One-time money for ongoing programs.</b> The state's budget analyst says income tax losses could run under $1 billion a year if billionaires leave. A Hoover analysis estimates a net loss of about $25 billion over time; drafter David Gamage disputes it.",
      "<b>The labor fight behind it.</b> SEIU-UHW's parent council went neutral. The teachers' union, firefighters, building trades, hospitals, clinics, doctors, and Governor Newsom all oppose it. The LA Times reported that union president Dave Regan offered to pull the measure in exchange for concessions including help winning contracts at medical facilities; Regan denies it. A clinic lawsuit over Prop 44 alleges the union offered to drop that measure if clinics dropped their opposition to this one; the union calls that \"categorically false.\""
    ],
    what: "A one-time tax equal to <b>5% of net worth</b> on billionaires who lived in California on January 1, 2026 (roughly 200 people, per CalMatters). Due in 2027, or spread over five years at a higher cost. Real estate, pensions, and retirement accounts are generally excluded. 90% of the money must go to health care; the rest to education, food assistance, and running the tax.",
    yes: "The state would collect a one-time tax from billionaires equal to 5% of their wealth.",
    no: "The state would not collect that tax.",
    cost: "Tens of billions of dollars in one-time revenue over several years. Possibly less than $1 billion a year in lost income tax if billionaires leave.",
    forWho: "SEIU-United Healthcare Workers West (sponsor and nearly its only funder), Senator Bernie Sanders, California Democratic Party, Teamsters California, California Nurses Association. They say it prevents hospital closures and coverage losses after federal Medi-Cal cuts.",
    against: "Governor Newsom, California Teachers Association, California Medical Association, California Professional Firefighters, California Taxpayers Association, LA Times editorial board. Funded mainly by tech billionaires including Sergey Brin. They say it is a one-time fix that will drive wealthy taxpayers out and shrink long-term revenue.",
    poll: "52% yes, 46% no", poll2: "An Independent Voter Project poll (September 23 to October 2, 2,906 likely voters) had it at 38% yes, 42% no after respondents heard the state analyst's description. That group is an advocacy organization.", gov: "Becerra: No. Hilton: No.",
    warn: "<b>Props 41 and 42 were written to block this one.</b> The state's budget analyst says that if Prop 41 or Prop 42 gets more yes votes than Prop 40, Prop 40 could be stopped from becoming law even if a majority votes yes on it." },
  { num: 41, name: "Audits and spending limit for new taxes", official: "Prohibits New State Taxes That Exclude Revenues from State Spending Limit. Requires Audits for New State Special Taxes. Initiative Constitutional Amendment.",
    money: "Yes side: about $58.4 million, essentially 100% from Building a Better California, the Sergey Brin-led billionaire committee described under Prop 40. The committee's official name lists small businesses, accountants, and auditing experts; none appear among its donors. No side: no separate committee. SEIU-UHW's Yes on 40 committee doubles as the No on 41 and 42 campaign.",
    also: [
      "<b>It bans a type of tax, not just adds audits.</b> Any new state tax enacted on or after January 1, 2026 that is written to sit outside the state spending limit could not be collected. Prop 40 is written exactly that way, which is why the two collide. Under the spending limit, revenue over the cap two years in a row must be returned to taxpayers, schools, or local governments.",
      "<b>The most-votes-wins clause.</b> Any measure on the same ballot with a tax outside the spending limit or different audit rules is declared \"in conflict,\" and the one with more yes votes wins. If Prop 40 beats it and is later struck down in court, Prop 41 springs back into effect.",
      "<b>Audits come with a built-in cut target.</b> Before a citizen tax initiative even qualifies, the State Auditor must identify ways to cut each program it would fund by 10%, and that summary goes in the voter guide. Programs funded by any new special tax get re-audited every four years.",
      "<b>Who pays for the audits:</b> the tax's own revenue if it passes, the general fund if it fails or never qualifies. Costs run in the low millions a year and grow over time.",
      "<b>Supporters' answer:</b> the official argument is signed by the state CPA society, a former State Auditor, and the California Taxpayers Association, who say new taxes deserve independent review."
    ],
    what: "Requires the State Auditor to review the programs a proposed tax initiative would fund before it goes on the ballot, and to audit new special taxes every four years. It also means the state might not be able to keep money from a new special tax outside the state spending limit. Prop 40 is written to sit outside that limit, which is where the two collide.",
    yes: "The State Auditor would review programs funded by proposed and new special taxes. The state might not be able to exclude new special tax spending from its spending limit.",
    no: "The State Auditor's duties and the spending limit rules would not change.",
    cost: "Unknown overall. Auditor costs likely in the low millions of dollars a year.",
    forWho: "California Chamber of Commerce, California Taxpayers Association, Reform California, and the Building a Better California committee funded by Sergey Brin and other billionaires. They say audits bring transparency to new taxes.",
    against: "SEIU-United Healthcare Workers West, California Democratic Party, California Federation of Labor Unions. They call it a billionaire-funded move to undo the billionaire tax.",
    poll: "51% yes, 44% no", gov: "Neither candidate has a public position that we could find.",
    warn: "<b>This is a countermeasure to Prop 40.</b> If it gets more yes votes than Prop 40, the billionaire tax could be blocked even if Prop 40 also passes." },
  { num: 42, name: "Ban on new state taxes on personal property", official: "Prohibits New State Personal Property Taxes and Certain Retroactive State Taxes. Initiative Constitutional Amendment.",
    money: "Yes side: about $128 million by mid-October, more than 99% from Building a Better California, the Sergey Brin-led billionaire committee described under Prop 40. The police officers' association gave $150,000. Firefighters, building trades, and AMVETS endorse it but do not appear as funders. No side: no separate committee. SEIU-UHW's Yes on 40 committee doubles as the No on 41 and 42 campaign.",
    also: [
      "<b>It reaches far beyond Prop 40, permanently.</b> It adds a constitutional ban on any new state tax on owning pensions, retirement accounts, mutual funds, business interests, and \"all personal property, whether tangible or intangible.\" That blocks future wealth taxes and taxes on unrealized gains by the Legislature or by voters, not just this one. No expiration and no amendment clause.",
      "<b>Existing taxes are grandfathered</b> if first collected by December 31, 2025, so the vehicle license fee and county business equipment taxes stay. Real estate taxes are untouched.",
      "<b>The retroactivity ban has one exception:</b> a tax can reach back up to 365 days if the Governor declares a disaster or fiscal emergency and the money is limited to that emergency.",
      "<b>The most-votes-wins clause.</b> Any same-ballot measure that taxes personal savings or applies retroactively is declared in conflict, and if Prop 42 gets more yes votes it wins \"in its entirety.\" A retired election lawyer put it plainly: Prop 42 needs only one more vote than Prop 40 to block it.",
      "<b>Supporters' answer:</b> the campaign says it protects retirement savings for the long term no matter what happens to Prop 40. SEIU-UHW says it is designed to trick voters."
    ],
    what: "Bars any new state tax on owning personal property, which means everything people own other than real estate: investments, retirement accounts, business stakes, art. Also bars state taxes that apply retroactively to past activity. It would cancel conflicting taxes enacted after January 1, 2026.",
    yes: "The state could not create new taxes on owning financial assets or other personal property.",
    no: "The state would keep the option to create those taxes.",
    cost: "State tax revenue might not grow as much in the future. No dollar figure.",
    forWho: "California Professional Firefighters, State Building and Construction Trades Council, AMVETS, Peace Officers Research Association of California, Reform California, and the Building a Better California committee. They say it protects retirement and savings from being taxed just for existing.",
    against: "SEIU-United Healthcare Workers West, Senator Bernie Sanders, California Democratic Party. They say it exists to shield billionaires from Prop 40.",
    poll: "54% yes, 43% no", gov: "Neither candidate has a public position that we could find.",
    warn: "<b>This is a countermeasure to Prop 40.</b> If it gets more yes votes than Prop 40, the billionaire tax could be blocked even if Prop 40 also passes." },
  { num: 43, name: "Two-thirds vote for citizen-proposed local taxes", official: "Limits Voters' Ability to Raise Revenues for Local Government Services. Legislative Constitutional Amendment.",
    money: "Yes side: about $14 million. Most is from the California Business Roundtable's PAC ($10 million), whose own donors include Peter Thiel, Eric Schmidt, and Chris Larsen. Also Los Angeles commercial real estate owners Kilroy Realty and Douglas Emmett ($1 million each) and the Howard Jarvis Taxpayers Association ($1 million). No side: about $7.2 million from SEIU ($2.5 million across locals), firefighters, teachers, carpenters, construction industry groups, and the League of California Cities.",
    also: [
      "<b>It reverses a 2017 state Supreme Court decision.</b> In the Upland case the court held that citizens using the initiative process are not bound by the two-thirds rule that applies to governments, and lower courts followed. Since then more than two dozen citizen-led local special taxes have passed with less than two-thirds support.",
      "<b>It came out of a deal, and its own author opposes it.</b> The Legislature put it on the ballot in June in exchange for the Howard Jarvis Taxpayers Association withdrawing a broader initiative that would also have hit charter-city transfer taxes and wiped out existing taxes like Los Angeles's Measure ULA mansion tax. This version drops both. Assemblymember Buffy Wicks, who wrote the language, says she is \"adamantly opposed.\"",
      "<b>Existing taxes are safe; future ones get harder.</b> It applies only to voter-proposed special taxes approved after January 1, 2027. Measure ULA, which passed with 57.8%, is unaffected. A pending Los Angeles half-cent sales tax for firefighters is the kind of measure that would need two-thirds going forward.",
      "<b>A quieter second provision:</b> it also writes into the constitution a bar on any local property tax above Prop 13's 1% rate, including by initiative. Hoover notes this gets little attention.",
      "<b>Who benefits, per each side:</b> opponents say corporate donors and developers; supporters say homeowners, renters, and small businesses. Neither claim is verified by any agency."
    ],
    what: "Today, a local special tax put on the ballot by a citizen petition can pass with a simple majority. This would raise that to <b>two-thirds</b>, starting January 1, 2027, the same bar that already applies when a local government proposes a special tax. Taxes already approved stay in place. It came out of a June 2026 deal in which the Howard Jarvis Taxpayers Association withdrew a broader measure.",
    yes: "Certain local taxes would need two-thirds approval from voters.",
    no: "Those local taxes could still pass with a majority vote.",
    cost: "Local tax revenue might not grow as much in the future.",
    forWho: "Howard Jarvis Taxpayers Association, California Taxpayers Association, Family Business Association of California, California Hispanic Chambers of Commerce. They say it closes a loophole in Prop 13.",
    against: "California Professional Firefighters, California Federation of Teachers, Nurse Alliance of SEIU California, California Democratic Party, the Sacramento Bee. They say it lets one-third of voters block funding for fire, schools, and roads.",
    poll: "43% yes, 51% no", gov: "Neither candidate has a public position that we could find." },
  { num: 44, name: "Spending rule for community health clinics", official: "Requires Community Health Clinics Spend 90% Of Revenue on Program Services. Initiative Statute.",
    money: "Yes side: about $17 million, all from SEIU-United Healthcare Workers West, the same union behind Prop 40. No side: about $17.5 million in the main committee and about $37.6 million counting allied groups, from the clinics being regulated: AltaMed ($6.1 million), the California Primary Care Association ($2.1 million), Family Health Centers of San Diego, WellSpace Health, North East Medical Services, San Ysidro Health, TrueCare, and others.",

const state = { view: "home", step: 0, answers: {}, showMethod: false, propIdx: 0, propVotes: {}, propReview: null, localCounty: "", localVotes: {}, localOpen: {} };

function lastName(fullName) {
  const parts = (fullName || '').trim().split(/\s+/);
  return parts[parts.length - 1];
}
function partyWord(p) { return p === 'R' ? 'Republican' : 'Democrat'; }
function toTop() {
  // Instant scroll, applied after the new screen is drawn. Smooth scrolling gets cancelled by the redraw on some phones.
  const up = () => { window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; };
  up(); requestAnimationFrame(up); setTimeout(up, 50);
}
function go(view) { state.view = view; render(); toTop(); }

// Governor flow order: top issues, then each issue question, then the dealbreaker question.
const GOV_STEPS = [TOP_ISSUE_Q].concat(QUESTIONS).concat([REDFLAG_Q]);

function render() {
  if (state.view === "home") return renderHome();
  if (state.view === "gov") return state.step >= GOV_STEPS.length ? renderGovResult() : renderGovQuestion();
  if (state.view === "props") return renderProp();
  if (state.view === "sheet") return renderSheet();
  if (state.view === "local") return renderLocal();
}

// ==================== GOVERNOR MATCHER ====================
function beginGov() { state.step = 0; go("gov"); }

function renderGovQuestion() {
  const q = GOV_STEPS[state.step];
  const pct = Math.round(((state.step + 1) / GOV_STEPS.length) * 100);
  let optsHtml, navHtml, helperHtml = '';
  const backBtn = `<button class="back-btn" onclick="govBack()">← Back</button>`;

  if (q.id === "topIssue") {
    const selected = state.answers.topIssue || [];
    optsHtml = q.options.map(opt => {
      const idx = selected.indexOf(opt.key);
      const rank = idx !== -1 ? `<span class="rank-badge">${idx + 1}</span>` : '';
      return `<button class="opt multi ${idx !== -1 ? 'selected' : ''}" onclick="toggleTop('${opt.key}')"><strong>${rank}${opt.label}</strong></button>`;
    }).join('');
    const n = selected.length;
    const helper = n === 0 ? `Tap up to <strong>${q.maxPicks}</strong> issues in order of importance`
      : n < q.maxPicks ? `<strong>${n} of ${q.maxPicks} picked.</strong> Tap another, or Continue`
      : `<strong>${q.maxPicks} picked.</strong> Tap Continue, or swap a pick`;
    helperHtml = `<p class="multi-helper">${helper}</p>`;
    navHtml = `
      <button class="continue-btn" onclick="govNext()" ${n === 0 ? 'disabled' : ''}>${n === 0 ? 'Pick at least one to continue' : 'Continue →'}</button>
      <div class="nav">${backBtn}<span class="nav-hint">${n > 0 ? n + ' selected' : ''}</span></div>`;
  } else {
    const selected = state.answers[q.id];
    optsHtml = q.options.map(opt => {
      const sub = opt.sub ? `<small>${opt.sub}</small>` : '';
      return `<button class="opt ${selected === opt.key ? 'selected' : ''}" onclick="govAnswer('${q.id}', '${opt.key}')"><strong>${opt.label}</strong>${sub}</button>`;
    }).join('');
    navHtml = `<div class="nav">${backBtn}<span class="nav-hint">Tap an answer to continue</span></div>`;
  }

  app.innerHTML = `
    <div class="fade-in">
      <div class="progress-row">
        <span class="progress-text">Question ${state.step + 1} of ${GOV_STEPS.length}</span>
        <div class="progress-bar"><div class="progress-fill" style="width: ${pct}%"></div></div>
      </div>
      <h2 class="q-title">${q.title}</h2>
      ${q.sub ? `<p class="q-sub">${q.sub}</p>` : ''}
      ${helperHtml}
      <div class="options">${optsHtml}</div>
      ${navHtml}
    </div>
  `;
}

function toggleTop(key) {
  if (!state.answers.topIssue) state.answers.topIssue = [];
  const arr = state.answers.topIssue;
  const idx = arr.indexOf(key);
  if (idx !== -1) arr.splice(idx, 1);
  else { if (arr.length >= TOP_ISSUE_Q.maxPicks) arr.pop(); arr.push(key); }
  render();
}
function govNext() { state.step++; render(); toTop(); }
function govAnswer(qid, key) {
  state.answers[qid] = key;
  render();
  setTimeout(() => { govNext(); }, 180);
}
function govBack() {
  if (state.step > 0) { state.step--; render(); toTop(); }
  else go("home");
}
function restartGov() { state.answers = {}; state.step = 0; state.showMethod = false; go("gov"); }

function issueMult(qid) {
  const idx = (state.answers.topIssue || []).indexOf(qid);
  return idx === -1 ? 1 : RANK_MULT[idx];
}

function computeScores() {
  const scores = { becerra: 0, hilton: 0 };
  let max = 0;
  QUESTIONS.forEach(q => {
    const opt = q.options.find(o => o.key === state.answers[q.id]);
    if (!opt) return;
    if (opt.w.becerra === 0 && opt.w.hilton === 0) return; // skip option
    const m = issueMult(q.id);
    CAND_KEYS.forEach(c => { scores[c] += opt.w[c] * m; });
    max += 5 * m;
  });
  const flag = REDFLAG_Q.options.find(o => o.key === state.answers.redflag);
  if (flag && flag.hits) scores[flag.hits] *= REDFLAG_PENALTY;
  const pct = {};
  CAND_KEYS.forEach(c => { pct[c] = max > 0 ? Math.round((scores[c] / max) * 100) : 0; });
  return { scores, max, pct, flag: flag && flag.hits ? flag : null };
}

function renderGovResult() {
  const r = computeScores();
  if (r.max === 0) {
    app.innerHTML = `
      <div class="fade-in">
        <div class="result-head">
          <div class="result-kicker">No match yet</div>
          <h2 class="result-name">Not enough to go on</h2>
          <p class="result-liner">You picked "not sure" on every issue, so there is nothing to compare. The full briefing lays out both candidates side by side.</p>
        </div>
        <div class="briefing-cta"><button class="briefing-cta-btn" onclick="openBriefing()">Read the full voter briefing</button></div>
        <div class="restart-wrap"><button class="restart-btn" onclick="restartGov()">Start Over</button></div>
      </div>`;
    return;
  }
  const tie = r.scores.becerra === r.scores.hilton;
  const topKey = r.scores.becerra >= r.scores.hilton ? "becerra" : "hilton";
  const otherKey = topKey === "becerra" ? "hilton" : "becerra";
  const top = CANDIDATES[topKey], other = CANDIDATES[otherKey];
  const close = !tie && Math.abs(r.pct.becerra - r.pct.hilton) <= 10;

  const duo = CAND_KEYS.map(c => `
    <div class="duo-card ${!tie && c === topKey ? 'top' : ''}">
      <div class="duo-name">${CANDIDATES[c].name}</div>
      <div class="duo-pct">${r.pct[c]}%</div>
      <div class="duo-label">alignment</div>
      <div class="duo-bar"><div class="duo-fill ${CANDIDATES[c].party}" style="width:${r.pct[c]}%"></div></div>
    </div>`).join('');

  // Issue by issue: top-ranked issues first, then the rest in question order.
  const ranked = state.answers.topIssue || [];
  const ordered = QUESTIONS.slice().sort((a, b) => {
    const ia = ranked.indexOf(a.id), ib = ranked.indexOf(b.id);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });
  const issuesHtml = ordered.map(q => {
    const opt = q.options.find(o => o.key === state.answers[q.id]);
    if (!opt) return '';
    const rankIdx = ranked.indexOf(q.id);
    const rankPill = rankIdx !== -1 ? `<span class="pill">Your #${rankIdx + 1} issue</span>` : '';
    const skipped = opt.w.becerra === 0 && opt.w.hilton === 0;
    let closer = null;
    if (!skipped && opt.w.becerra !== opt.w.hilton) closer = opt.w.becerra > opt.w.hilton ? "becerra" : "hilton";
    const stanceHtml = CAND_KEYS.map(c => {
      const isCloser = closer === c && opt.w[c] >= 3;
      return `<div class="stance ${CANDIDATES[c].party} ${isCloser ? 'closer' : ''}"><b>${lastName(CANDIDATES[c].name)}:</b>${isCloser ? '<span class="closer-tag">closer to your answer</span>' : ''} ${q.stance[c]}</div>`;
    }).join('');
    let note = '';
    if (opt.note) note = `<div class="issue-note">${opt.note}</div>`;
    else if (skipped) note = `<div class="issue-note">This answer did not count toward either candidate.</div>`;
    else if (!closer) note = `<div class="issue-note">This answer counted the same for both candidates.</div>`;
    return `
      <div class="issue-row">
        <div class="issue-head"><span class="issue-name">${q.label}</span>${rankPill}</div>
        <div class="issue-pick">You picked <strong>${opt.label.charAt(0).toLowerCase() + opt.label.slice(1)}</strong>.</div>
        ${stanceHtml}
        ${note}
      </div>`;
  }).join('');

  const flagHtml = r.flag ? `<div class="prop-warn"><b>Your dealbreaker:</b> you picked "${r.flag.label.charAt(0).toLowerCase() + r.flag.label.slice(1)}." That applies to ${lastName(CANDIDATES[r.flag.hits].name)}, so his score was cut in half.</div>` : '';

  const headHtml = tie ? `
        <div class="result-kicker">Your Result</div>
        <h2 class="result-name">An even split</h2>
        <p class="result-liner">Your answers lined up equally with both candidates. The issue-by-issue breakdown below shows where each one matched you.</p>`
    : `
        <div class="result-kicker">${close ? 'Your Closer Match' : 'Your Match'}</div>
        <h2 class="result-name">${top.name}</h2>
        <p class="result-liner">${top.oneLiner}</p>
        <span class="party-badge ${top.party}">${partyWord(top.party)}</span>`;

  const caveatHtml = (tie ? CAND_KEYS : [topKey, otherKey]).map(c => `
      <div class="caveat" ${c !== topKey || tie ? 'style="background:#f7f7f5 !important;border-left-color:#5a544a;"' : ''}>
        <div class="caveat-title">${tie || c !== topKey ? 'What to know about ' + lastName(CANDIDATES[c].name) : 'What to know before you vote'}</div>
        <div class="caveat-body">${CAVEATS[c]}</div>
      </div>`).join('');

  app.innerHTML = `
    <div class="fade-in">
      <div class="result-head">
        ${headHtml}
        <div class="duo">${duo}</div>
        ${close ? `<p class="hint">The two scores are within 10 points. Your priorities span both candidates.</p>` : ''}
      </div>

      ${flagHtml}

      <div class="section">
        <div class="section-title">Issue by issue</div>
        ${issuesHtml}
      </div>

      ${caveatHtml}

      <button class="method-toggle" onclick="toggleMethod()">${state.showMethod ? 'Hide' : 'How is your match calculated?'}</button>
      <div class="method-body ${state.showMethod ? 'open' : ''}">
        <p>For each question, both candidates got a score from <strong>0 to 5</strong> for the answer you picked, based on how closely their public record, platform, and stated positions match it.</p>
        <p>The issues you ranked at the start <strong>count extra</strong>: your #1 issue counts double, your #2 counts 1.6 times, and your #3 counts 1.3 times.</p>
        <p>Each candidate's total is divided by the most points possible for the questions you answered. That gives both candidates a 0 to 100 scale. "Not sure" answers are left out.</p>
        <p>The two percentages do not have to add up to 100. On some answers both candidates earn points, because their positions overlap or neither one fully matches what you picked.</p>
        <p>If you named a dealbreaker, the candidate it applies to had his score cut in half.</p>
        <p>This is not a poll, a prediction, or an endorsement. It compares what you said you want with what each candidate has put on the public record.</p>
      </div>

      <div class="briefing-cta">
        <button class="briefing-cta-btn" onclick="beginProps()">Next: the 14 propositions</button>
        <p class="briefing-cta-hint">What each measure does, and a cheat sheet of your picks.</p>
      </div>
      <div class="briefing-link-row">
        <button class="briefing-link" onclick="openBriefing()">Read the full voter briefing →</button>
      </div>

      <div class="restart-wrap">
        <button class="restart-btn" onclick="restartGov()">Start Over</button>
        <button class="restart-btn" style="margin-left:8px;" onclick="go('home')">Home</button>
      </div>
      <p class="footer">This match reflects how your answers line up with each candidate's public record and platform. Not a prediction. Not a recommendation.</p>
    </div>
  `;
}
function toggleMethod() { state.showMethod = !state.showMethod; render(); }

// ==================== PROPOSITIONS ====================
function beginProps() { state.propIdx = 0; state.propReview = null; go("props"); }

function propDetailHtml(p, opts) {
  opts = opts || {};
  return `
      ${opts.local ? '' : `<div class="prop-block" style="border-top:none;padding-top:0;"><div class="prop-label">What it does</div><div class="prop-text">${p.what}</div></div>`}
      ${p.warn ? `<div class="prop-warn">${p.warn}</div>` : ''}
      <div class="prop-block"><div class="prop-label">What your vote means</div>
        <div class="yn-grid">
          <div class="yn y"><b>Yes:</b> ${p.yes}</div>
          <div class="yn n"><b>No:</b> ${p.no}</div>
        </div>
      </div>
      <div class="prop-block"><div class="prop-label">Cost</div><div class="prop-text">${p.cost}</div></div>
      <div class="prop-block"><div class="prop-label">Who is for it</div><div class="prop-text">${p.forWho}</div></div>
      <div class="prop-block"><div class="prop-label">Who is against it</div><div class="prop-text">${p.against}</div></div>
      ${p.money ? `<div class="prop-block"><div class="prop-label">Who is paying</div><div class="prop-text">${p.money.replace('Yes side:', '<b>Yes side:</b>').replace(' No side:', '<br><br><b>No side:</b>').replace(/^No committee/, '<b>No committee</b>')}</div></div>` : ''}
      ${p.also ? `<div class="prop-block"><div class="prop-label">What it also does</div><ul class="prop-list">${p.also.map(x => `<li>${x}</li>`).join('')}</ul></div>` : ''}
      ${opts.local ? '' : `<div class="prop-block"><div class="prop-label">The candidates for governor</div><div class="prop-text">${p.gov}</div></div>`}
      ${opts.local ? '' : `<div class="prop-block"><div class="prop-label">Latest poll</div><div class="prop-text">${p.poll} among likely voters (PPIC, September 4 to 10, 2026).${p.poll2 ? ' ' + p.poll2 : ''}</div></div>`}`;
}

function renderProp() {
  const i = state.propIdx;
  const p = PROPS[i];
  const pct = Math.round(((i + 1) / PROPS.length) * 100);
  const v = state.propVotes[p.num];
  const reviewing = state.propReview !== null;
  app.innerHTML = `
    <div class="fade-in">
      <div class="progress-row">
        <span class="progress-text">Measure ${i + 1} of ${PROPS.length}</span>
        <div class="progress-bar"><div class="progress-fill" style="width: ${pct}%"></div></div>
      </div>
      <span class="prop-num">Proposition ${p.num}</span>
      <h2 class="q-title">${p.name}</h2>
      <p class="prop-official">Official title: ${p.official}</p>
      ${propDetailHtml(p)}
      <div class="prop-block">
        <div class="prop-label">Where do you land?</div>
        <div class="vote-row">
          <button type="button" class="vote-btn ${v === 'yes' ? 'sel-yes' : ''}" onclick="propVote(${p.num}, 'yes', this)">Yes</button>
          <button type="button" class="vote-btn ${v === 'no' ? 'sel-no' : ''}" onclick="propVote(${p.num}, 'no', this)">No</button>
          <button type="button" class="vote-btn ${v === 'und' ? 'sel-und' : ''}" onclick="propVote(${p.num}, 'und', this)">Undecided</button>
        </div>
      </div>
      <div class="nav">
        <button class="back-btn" onclick="propBack()">← ${reviewing ? 'Back to my cheat sheet' : 'Back'}</button>
        <span class="nav-hint">${reviewing ? 'Tap to change your pick' : 'Tap a pick to continue'}</span>
      </div>
      ${reviewing ? '' : `<div class="briefing-link-row"><button class="briefing-link" onclick="go('sheet')">Skip to my cheat sheet →</button></div>`}
    </div>
  `;
}
let voteLock = false;
function propVote(num, v, btn) {
  if (voteLock) return;
  voteLock = true;
  state.propVotes[num] = v;
  // Mark the tapped button in place instead of rebuilding the page under the finger.
  if (btn && btn.parentNode) {
    Array.from(btn.parentNode.querySelectorAll('.vote-btn')).forEach(b => b.classList.remove('sel-yes', 'sel-no', 'sel-und'));
    btn.classList.add('sel-' + v);
  }
  setTimeout(() => {
    voteLock = false;
    if (state.propReview !== null) { state.propReview = null; go("sheet"); return; }
    if (state.propIdx < PROPS.length - 1) { state.propIdx++; go("props"); }
    else go("sheet");
  }, 180);
}
function propBack() {
  if (state.propReview !== null) { state.propReview = null; go("sheet"); return; }
  if (state.propIdx > 0) { state.propIdx--; render(); toTop(); }
  else go("home");
}
function reviewProp(idx) { state.propIdx = idx; state.propReview = idx; go("props"); }

function renderSheet() {
  const pv = state.propVotes;
  const label = { yes: "Yes", no: "No", und: "Undecided" };
  const rows = PROPS.map((p, idx) => {
    const v = pv[p.num] || "und";
    return `
      <div class="sheet-row">
        <span class="sheet-num">Prop ${p.num}</span>
        <span class="sheet-name">${p.name}<button class="no-print" onclick="reviewProp(${idx})">Review or change</button></span>
        <span class="sheet-pick ${v}">${pv[p.num] ? label[v] : 'No pick'}</span>
      </div>`;
  }).join('');
  let warn = '';
  if (pv[40] === 'yes' && (pv[41] === 'yes' || pv[42] === 'yes')) {
    const which = [41, 42].filter(n => pv[n] === 'yes').map(n => 'Prop ' + n).join(' and ');
    warn = `<div class="prop-warn"><b>Heads up: these picks work against each other.</b> You marked yes on Prop 40 (the billionaire tax) and yes on ${which}. Props 41 and 42 were written to block Prop 40. If either one gets more yes votes than Prop 40, the billionaire tax could be stopped even if it passes. If you want the billionaire tax to take effect, a yes on 41 or 42 cuts against that.</div>`;
  }
  const lv = state.localVotes;
  const localRows = localMeasures(state.localCounty).filter(m => lv[m.id]).map(m => `
      <div class="sheet-row">
        <span class="sheet-num">Measure ${m.letter}</span>
        <span class="sheet-name">${m.name} <small style="color:#6a6a67;">(${m.juris})</small><button class="no-print" onclick="state.localOpen['${m.id}']=true; go('local')">Review or change</button></span>
        <span class="sheet-pick ${lv[m.id]}">${label[lv[m.id]]}</span>
      </div>`).join('');
  const localBlock = localRows ? `<div class="section"><div class="prop-label" style="margin:14px 0 6px;">${state.localCounty} County</div>${localRows}</div>` : '';
  const picked = PROPS.filter(p => pv[p.num]).length;
  app.innerHTML = `
    <div class="fade-in">
      <div class="result-head" style="padding-bottom:20px;">
        <div class="result-kicker">Your Ballot Cheat Sheet</div>
        <h2 class="result-name" style="font-size:clamp(28px,6vw,36px);">14 propositions, your picks</h2>
        <p class="result-liner">${picked} of ${PROPS.length} marked. Screenshot or print this and keep it next to your ballot.</p>
      </div>
      ${warn}
      <div class="section">${rows}</div>
      ${localBlock}
      <div class="briefing-cta no-print">
        <button class="briefing-cta-btn" onclick="shareSheet()">Send my cheat sheet to myself</button>
        <div class="share-row">
          <button class="restart-btn" onclick="copySheet(this)">Copy as text</button>
          <button class="restart-btn" onclick="window.print()">Print</button>
        </div>
        <p class="briefing-cta-hint">Opens your phone's share menu so you can text or email it to yourself. Your picks stay on this device until you choose to send them.</p>
      </div>
      <div class="briefing-cta no-print" style="margin-top:8px;">
        <button class="briefing-cta-btn" onclick="go('local')">Next: what else is on my ballot?</button>
        <p class="briefing-cta-hint">Your county, city, school district, and local measures.</p>
      </div>
      <div class="restart-wrap no-print">
        <button class="restart-btn" onclick="beginGov()">Governor matcher</button>
        <button class="restart-btn" style="margin-left:8px;" onclick="go('home')">Home</button>
      </div>
      <p class="footer">Summaries draw on the official state voter guide and the Legislative Analyst's Office. This is a study aid, not a recommendation.</p>
    </div>
  `;
}

function sheetText() {
  const label = { yes: "Yes", no: "No", und: "Undecided" };
  const lines = PROPS.map(p => `Prop ${p.num} (${p.name}): ${state.propVotes[p.num] ? label[state.propVotes[p.num]] : "no pick"}`);
  let gov = '';
  if (QUESTIONS.some(q => state.answers[q.id])) {
    const r = computeScores();
    gov = `\nGovernor match: Becerra ${r.pct.becerra}%, Hilton ${r.pct.hilton}%\n`;
  }
  const local = localMeasures(state.localCounty).filter(m => state.localVotes[m.id]).map(m => `Measure ${m.letter} (${m.juris}, ${m.name}): ${label[state.localVotes[m.id]]}`);
  const localTxt = local.length ? `\n\n${state.localCounty} County:\n${local.join('\n')}` : '';
  return `My California ballot cheat sheet (November 3, 2026)\n${gov}\n${lines.join('\n')}${localTxt}\n\nFrom https://candiland-ux.github.io/CaliGovInfo/`;
}
async function shareSheet() {
  const text = sheetText();
  if (navigator.share) {
    try { await navigator.share({ title: "My California ballot cheat sheet", text }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  window.location.href = "mailto:?subject=" + encodeURIComponent("My California ballot cheat sheet") + "&body=" + encodeURIComponent(text);
}
function copySheet(btn) {
  const text = sheetText();
  const done = () => { const o = btn.textContent; btn.textContent = "Copied ✓"; setTimeout(() => btn.textContent = o, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => window.prompt("Copy your cheat sheet:", text));
  else window.prompt("Copy your cheat sheet:", text);
}

function togglePrompt() {
  const body = document.getElementById('promptBody');
  const toggle = document.getElementById('promptToggle');
  if (body.style.display === 'none') { body.style.display = 'block'; toggle.textContent = 'hide prompt ↑'; }
  else { body.style.display = 'none'; toggle.textContent = 'show the AI prompt ↓'; }
}
function copyPrompt() {
  const text = document.getElementById('promptText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.prompt-copy');
    const original = btn.textContent;
    btn.textContent = 'Copied ✓';
    setTimeout(() => { btn.textContent = original; }, 2000);
  }).catch(() => {
    const range = document.createRange();
    range.selectNode(document.getElementById('promptText'));
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
  });
}

    <h2 class="b-h1" id="props">The 14 Propositions</h2>

    <div class="prop-warn"><b>Follow the money across measures.</b> One committee, Building a Better California, funded mostly by Google co-founder Sergey Brin and other tech billionaires, is paying for No on 40 ($118.5 million), Yes on 41 ($58.4 million), Yes on 42 ($127.8 million), and part of Yes on 45 ($10 million), plus smaller gifts to Props 1 and 37. One union, SEIU-United Healthcare Workers West, is nearly the sole funder of Yes on 40 ($32 million) and Yes on 44 ($17 million). The community clinics are on the No side of 40 and 44 and the Yes side of 45.</div>
