<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="supported-color-schemes" content="light">
<title>California 2026 General Election: Governor Matcher and Proposition Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light only; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #ffffff !important;
    color: #111111 !important;
    -webkit-text-fill-color: #111111;
    font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
  }

  @media (prefers-color-scheme: dark) {
    html, body { background: #ffffff !important; color: #111111 !important; -webkit-text-fill-color: #111111; }
  }

  .stage {
    max-width: 680px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  /* INTRO */
  .tag {
    display: inline-block;
    background: #1a1a1a !important;
    color: #ffffff !important;
    -webkit-text-fill-color: #ffffff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    padding: 6px 12px;
    text-transform: uppercase;
    border-radius: 3px;
    margin-bottom: 24px;
  }

  h1 {
    font-size: clamp(32px, 7vw, 44px);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
    color: #111 !important;
    -webkit-text-fill-color: #111;
  }

  .lede {
    font-size: 18px;
    color: #444 !important;
    -webkit-text-fill-color: #444;
    margin-bottom: 32px;
    line-height: 1.45;
  }

  .intro-card {
    background: #f7f5f0 !important;
    border: 1px solid #e4e0d6;
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 28px;
  }

  .intro-card h3 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #888 !important;
    -webkit-text-fill-color: #888;
    margin-bottom: 16px;
  }

  .intro-steps {
    list-style: none;
    counter-reset: steps;
  }

  .intro-steps li {
    counter-increment: steps;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 10px 0;
    border-bottom: 1px solid #e4e0d6;
    font-size: 15px;
    line-height: 1.4;
    color: #222 !important;
    -webkit-text-fill-color: #222;
  }
  .intro-steps li:last-child { border-bottom: none; }
  .intro-steps li::before {
    content: counter(steps);
    background: #111 !important;
    color: #fff !important;
    -webkit-text-fill-color: #fff;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat {
    background: #fff !important;
    border: 1px solid #e4e0d6;
    border-radius: 6px;
    padding: 14px 10px;
    text-align: center;
  }
  .stat-num {
    font-size: 22px;
    font-weight: 700;
    color: #111 !important;
    -webkit-text-fill-color: #111;
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-label {
    font-size: 11px;
    color: #666 !important;
    -webkit-text-fill-color: #666;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .cta-wrap {
    text-align: center;
    padding: 12px 0;
  }

  .cta {
    display: block;
    width: 100%;
    background: #c8321a !important;
    color: #ffffff !important;
    -webkit-text-fill-color: #ffffff !important;
    border: none;
    font-family: inherit;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.01em;
    padding: 18px 24px;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 2px 0 #8a1f0c;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .cta:hover, .cta:focus { background: #b02816 !important; }
  .cta:active { transform: translateY(2px); box-shadow: 0 0 0 #8a1f0c; }

  .hint {
    font-size: 13px;
    color: #666 !important;
    -webkit-text-fill-color: #666;
    margin-top: 12px;
    font-style: italic;
  }

  .disclaimer {
    margin-top: 28px;
    padding: 14px 16px;
    background: #fffaf0 !important;
    border-left: 3px solid #c8321a;
    border-radius: 4px;
    font-size: 13px;
    line-height: 1.5;
    color: #444 !important;
    -webkit-text-fill-color: #444;
  }
  .disclaimer strong { color: #111 !important; -webkit-text-fill-color: #111; }

  .resources {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .resource-link {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: #faf7f0 !important;
    border: 1px solid #e3ddc9;
    border-left: 3px solid #c8321a;
    border-radius: 4px;
    text-decoration: none;
    color: inherit;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    text-align: left;
    width: 100%;
  }
  .resource-link:hover, .resource-link:active {
    background: #f3eedc !important;
  }
  .resource-label {
    color: #2a251e !important;
    -webkit-text-fill-color: #2a251e;
    font-weight: 500;
  }
  .resource-host {
    color: #c8321a !important;
    -webkit-text-fill-color: #c8321a;
    font-size: 12px;
    white-space: nowrap;
    margin-left: 12px;
  }
  .prompt-body {
    margin-top: -4px;
    padding: 16px 18px;
    background: #faf7f0 !important;
    border: 1px solid #e3ddc9;
    border-radius: 4px;
    font-size: 13px;
    line-height: 1.55;
  }
  .prompt-intro {
    margin: 0 0 12px;
    color: #5a544a !important;
    -webkit-text-fill-color: #5a544a;
  }
  .prompt-text {
    background: #fff !important;
    border: 1px solid #e3ddc9;
    border-radius: 4px;
    padding: 12px 14px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.5;
    color: #2a251e !important;
    -webkit-text-fill-color: #2a251e;
    white-space: pre-wrap;
    word-wrap: break-word;
    max-height: 360px;
    overflow-y: auto;
    margin: 0 0 12px;
  }
  .prompt-copy {
    background: #c8321a !important;
    color: #fff !important;
    -webkit-text-fill-color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .prompt-copy:hover, .prompt-copy:active {
    background: #a82914 !important;
  }

  .data-banner {
    padding: 10px 14px;
    background: #fef5f2 !important;
    border-left: 3px solid #c8441c;
    border-radius: 4px;
    margin-bottom: 20px;
    font-size: 13px;
    line-height: 1.5;
    color: #4a2a20 !important;
    -webkit-text-fill-color: #4a2a20;
  }
  .data-banner strong {
    color: #8a2010 !important;
    -webkit-text-fill-color: #8a2010;
    font-weight: 700;
  }
  .data-banner a {
    color: #8a2010 !important;
    -webkit-text-fill-color: #8a2010;
    text-decoration: underline;
  }

  /* ==================== ECONOMIC CONTEXT CALLOUT ==================== */
  .econ-callout {
    background: #faf7f0 !important;
    border: 1px solid #2a251e;
    padding: 20px;
    margin: 24px 0;
  }
  .econ-callout-kicker {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #8b2e1f !important;
    -webkit-text-fill-color: #8b2e1f;
    margin-bottom: 6px;
  }
  .econ-callout-title {
    font-size: 18px;
    font-weight: 700;
    color: #1a1814 !important;
    -webkit-text-fill-color: #1a1814;
    margin-bottom: 10px;
    line-height: 1.25;
  }
  .econ-callout-lead {
    font-size: 14px;
    color: #3a352e !important;
    -webkit-text-fill-color: #3a352e;
    line-height: 1.5;
    margin-bottom: 14px;
  }
  .econ-tables-grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 6px;
  }
  .econ-table-wrap {
    background: #f0ebdc !important;
    border: 1px solid #2a251e;
    display: flex;
    flex-direction: column;
  }
  .econ-table-label {
    background: #1a1814 !important;
    color: #faf7f0 !important;
    -webkit-text-fill-color: #faf7f0;
    padding: 8px 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .econ-table-scroll {
    max-height: 280px;
    overflow-y: auto;
    background: #faf7f0 !important;
  }
  .econ-table-scroll::-webkit-scrollbar { width: 8px; }
  .econ-table-scroll::-webkit-scrollbar-track { background: #f0ebdc; }
  .econ-table-scroll::-webkit-scrollbar-thumb { background: #2a251e; border-radius: 0; }
  .econ-mini-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    table-layout: fixed;
  }
  .econ-mini-table thead {
    position: sticky;
    top: 0;
    z-index: 1;
  }
  .econ-mini-table th {
    background: #1a1814 !important;
    color: #faf7f0 !important;
    -webkit-text-fill-color: #faf7f0;
    padding: 6px 6px;
    text-align: left;
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .econ-mini-table th:nth-child(1) { width: 30%; }
  .econ-mini-table th:nth-child(2) { width: 22%; }
  .econ-mini-table th:nth-child(3) { width: 28%; }
  .econ-mini-table th:nth-child(4) { width: 20%; }
  .econ-mini-table td {
    padding: 6px 6px;
    border-bottom: 1px solid rgba(42,37,30,0.12);
    vertical-align: top;
    color: #2a251e !important;
    -webkit-text-fill-color: #2a251e;
    font-size: 12px;
    line-height: 1.35;
    word-wrap: normal;
    overflow-wrap: normal;
    word-break: normal;
  }
  .econ-mini-table td:first-child {
    font-weight: 600;
    background: rgba(42,37,30,0.04) !important;
  }
  .econ-mini-table td:nth-child(2), .econ-mini-table td:nth-child(3) {
    color: #5a544a !important;
    -webkit-text-fill-color: #5a544a;
  }
  .econ-tag {
    font-size: 9px !important;
    padding: 2px 4px !important;
    letter-spacing: 0.02em !important;
  }
  .econ-table-foot {
    padding: 8px 12px;
    font-size: 11px;
    line-height: 1.45;
    color: #2a251e !important;
    -webkit-text-fill-color: #2a251e;
    background: #e5e1d6 !important;
    border-top: 1px solid #2a251e;
  }
  .econ-table-foot strong { color: #1a1814 !important; -webkit-text-fill-color: #1a1814; }

  /* ==================== ECONOMIC OVERLAY ==================== */
  .econ-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #faf7f0 !important;
    z-index: 1000;
    display: none;
    overflow-y: auto;
  }
  .econ-overlay.open { display: block; }
  .econ-top {
    position: sticky;
    top: 0;
    background: #faf7f0 !important;
    border-bottom: 1px solid #2a251e;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }
  .econ-top-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #8b2e1f !important;
    -webkit-text-fill-color: #8b2e1f;
  }
  .econ-close {
    background: #1a1814 !important;
    color: #faf7f0 !important;
    -webkit-text-fill-color: #faf7f0;
    border: none;
    padding: 8px 16px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    border-radius: 4px;
    cursor: pointer;
  }
  .econ-content {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }
  .econ-content h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 12px;
    color: #1a1814 !important;
    -webkit-text-fill-color: #1a1814;
    line-height: 1.15;
  }
  .econ-content h2 {
    font-size: 20px;
    font-weight: 700;
    margin-top: 36px;
    margin-bottom: 12px;
    color: #8b2e1f !important;
    -webkit-text-fill-color: #8b2e1f;
    padding-bottom: 6px;
    border-bottom: 2px solid #8b2e1f;
  }
  .econ-content h3 {
    font-size: 16px;
    font-weight: 700;
    margin-top: 24px;
    margin-bottom: 10px;
    color: #1a1814 !important;
    -webkit-text-fill-color: #1a1814;
  }
  .econ-content .section-kicker {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: #8b2e1f !important;
    -webkit-text-fill-color: #8b2e1f;
    margin-top: 36px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .econ-content p {
    font-size: 15px;
    line-height: 1.6;
    color: #2a251e !important;
    -webkit-text-fill-color: #2a251e;
    margin-bottom: 14px;
  }
  .econ-content p.lead {
    font-size: 17px;
    font-weight: 400;
    color: #1a1814 !important;
    -webkit-text-fill-color: #1a1814;
  }
  .econ-content ul {
    padding-left: 20px;
    margin-bottom: 16px;
  }
  .econ-content ul li {
    font-size: 15px;
    line-height: 1.6;
    color: #2a251e !important;
    -webkit-text-fill-color: #2a251e;
    margin-bottom: 6px;
  }
  .econ-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin: 16px 0;
    border: 1px solid #2a251e;
    background: #f0ebdc !important;
  }
  .econ-table th {
    background: #1a1814 !important;
    color: #faf7f0 !important;
    -webkit-text-fill-color: #faf7f0;
    padding: 10px 8px;
    text-align: left;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .econ-table th small {
    display: block;
    font-size: 9px;
    opacity: 0.75;
    letter-spacing: 0;
    text-transform: none;
    font-weight: 400;
    margin-top: 2px;
  }
  .econ-table td {
    padding: 9px 8px;
    border-bottom: 1px solid rgba(42,37,30,0.12);
    vertical-align: top;
    color: #2a251e !important;
    -webkit-text-fill-color: #2a251e;
  }
  .econ-table td:first-child {
    font-weight: 600;
    background: rgba(42,37,30,0.04) !important;
    font-size: 13px;
  }
  .econ-tag {
    display: inline-block;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 600;
    border-radius: 2px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .econ-tag-worse { background: #f4d9d3 !important; color: #8b2e1f !important; -webkit-text-fill-color: #8b2e1f; }
  .econ-tag-better { background: #d4e8d9 !important; color: #2d5a3d !important; -webkit-text-fill-color: #2d5a3d; }
  .econ-tag-neutral { background: #e5e1d6 !important; color: #5a544a !important; -webkit-text-fill-color: #5a544a; }
  .econ-callout-box {
    background: #f0ebdc !important;
    border-left: 3px solid #8b2e1f;
    padding: 12px 14px;
    margin: 12px 0;
    font-size: 14px;
    line-height: 1.55;
  }
  .econ-callout-box-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #8b2e1f !important;
    -webkit-text-fill-color: #8b2e1f;
    display: block;
    margin-bottom: 4px;
  }
  .econ-scorecard {
    background: #1a1814 !important;
    color: #faf7f0 !important;
    -webkit-text-fill-color: #faf7f0;
    padding: 14px 16px;
    font-size: 14px;
    margin: 12px 0 20px;
  }
  .econ-scorecard strong { color: #faf7f0 !important; -webkit-text-fill-color: #faf7f0; }
  .econ-glossary-item {
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(42,37,30,0.12);
  }
  .econ-glossary-item:last-child { border-bottom: none; }
  .econ-glossary-term {
    font-size: 14px;
    font-weight: 700;
    color: #8b2e1f !important;
    -webkit-text-fill-color: #8b2e1f;
    display: block;
    margin-bottom: 3px;
  }
  .econ-glossary-def {
    font-size: 13px;
    line-height: 1.5;
    color: #2a251e !important;
    -webkit-text-fill-color: #2a251e;
  }

  /* ==========================================================
     BRIEFING: full-screen overlay
     ========================================================== */
  .briefing-link-row {
    margin-top: 16px;
    text-align: center;
  }
  .briefing-link {
    display: inline-block;
    background: transparent !important;
    color: #c8441c !important;
    -webkit-text-fill-color: #c8441c;
    border: none;
    font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    padding: 10px 4px;
    text-decoration: underline;
    text-underline-offset: 4px;
    -webkit-appearance: none;
    appearance: none;
  }
  .briefing-link:hover, .briefing-link:active {
    color: #a0361a !important;
    -webkit-text-fill-color: #a0361a;
  }

  /* Prominent briefing CTA on result page */
  .briefing-cta {
    margin: 32px 0 20px;
    padding: 20px 22px;
    background: #f7f6f3 !important;
    border: 1px solid #1a1a1a;
    text-align: center;
  }
  .briefing-cta-btn {
    display: inline-block;
    background: #1a1a1a !important;
    color: #ffffff !important;
    -webkit-text-fill-color: #ffffff;
    border: none;
    font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 14px 28px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    transition: background-color 0.15s;
  }
  .briefing-cta-btn:hover, .briefing-cta-btn:active {
    background: #c8441c !important;
  }
  .briefing-cta-hint {
    margin-top: 12px;
    font-size: 13px;
    font-style: italic;
    color: #6a6a67 !important;
    -webkit-text-fill-color: #6a6a67;
  }

  .briefing-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #ffffff !important;
    z-index: 10000;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .briefing-overlay.open { display: block; }
  .briefing-topbar {
    position: sticky;
    top: 0;
    background: #ffffff !important;
    border-bottom: 1px solid #e5e3de;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }
  .briefing-topbar-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #111 !important;
    -webkit-text-fill-color: #111;
  }
  .briefing-close {
    background: transparent !important;
    border: 1px solid #111;
    color: #111 !important;
    -webkit-text-fill-color: #111;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .briefing-close:hover, .briefing-close:active {
    background: #111 !important;
    color: #fff !important;
    -webkit-text-fill-color: #fff;
  }
  .briefing-stage {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }
  .briefing-stage h2.b-h1 {
    font-size: clamp(24px, 5vw, 30px);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: #111 !important;
    -webkit-text-fill-color: #111;
    margin: 28px 0 12px;
    padding-bottom: 10px;
    border-bottom: 2px solid #111;

const state = { view: "home", step: 0, answers: {}, showMethod: false, propIdx: 0, propVotes: {}, propReview: null };
const app = document.getElementById('app');

function lastName(fullName) {
  const parts = (fullName || '').trim().split(/\s+/);
  return parts[parts.length - 1];
}
function partyWord(p) { return p === 'R' ? 'Republican' : 'Democrat'; }
function go(view) { state.view = view; window.scrollTo({ top: 0, behavior: 'smooth' }); render(); }

// Governor flow order: top issues, then each issue question, then the dealbreaker question.
const GOV_STEPS = [TOP_ISSUE_Q].concat(QUESTIONS).concat([REDFLAG_Q]);

function render() {
  if (state.view === "home") return renderHome();
  if (state.view === "gov") return state.step >= GOV_STEPS.length ? renderGovResult() : renderGovQuestion();
  if (state.view === "props") return renderProp();
  if (state.view === "sheet") return renderSheet();
}

function beginGov() { state.step = 0; go("gov"); }

function renderGovQuestion() {
  const q = GOV_STEPS[state.step];
  const pct = Math.round(((state.step + 1) / GOV_STEPS.length) * 100);
  let optsHtml, navHtml, helperHtml = '';
  const backBtn = `<button class="back-btn" onclick="govBack()">← Back</button>`;

  if (q.id === "topIssue") {
    const selected = state.answers.topIssue || [];
    optsHtml = q.options.map(opt => {
      const idx = selected.indexOf(opt.key);
      const rank = idx !== -1 ? `<span class="rank-badge">${idx + 1}</span>` : '';
      return `<button class="opt multi ${idx !== -1 ? 'selected' : ''}" onclick="toggleTop('${opt.key}')"><strong>${rank}${opt.label}</strong></button>`;
    }).join('');
    const n = selected.length;
    const helper = n === 0 ? `Tap up to <strong>${q.maxPicks}</strong> issues in order of importance`
      : n < q.maxPicks ? `<strong>${n} of ${q.maxPicks} picked.</strong> Tap another, or Continue`
      : `<strong>${q.maxPicks} picked.</strong> Tap Continue, or swap a pick`;
    helperHtml = `<p class="multi-helper">${helper}</p>`;
    navHtml = `
      <button class="continue-btn" onclick="govNext()" ${n === 0 ? 'disabled' : ''}>${n === 0 ? 'Pick at least one to continue' : 'Continue →'}</button>
      <div class="nav">${backBtn}<span class="nav-hint">${n > 0 ? n + ' selected' : ''}</span></div>`;
  } else {
    const selected = state.answers[q.id];
    optsHtml = q.options.map(opt => {
      const sub = opt.sub ? `<small>${opt.sub}</small>` : '';
      return `<button class="opt ${selected === opt.key ? 'selected' : ''}" onclick="govAnswer('${q.id}', '${opt.key}')"><strong>${opt.label}</strong>${sub}</button>`;
    }).join('');
    navHtml = `<div class="nav">${backBtn}<span class="nav-hint">Tap an answer to continue</span></div>`;
  }

  app.innerHTML = `
    <div class="fade-in">
      <div class="progress-row">
        <span class="progress-text">Question ${state.step + 1} of ${GOV_STEPS.length}</span>
        <div class="progress-bar"><div class="progress-fill" style="width: ${pct}%"></div></div>
      </div>
      <h2 class="q-title">${q.title}</h2>
      ${q.sub ? `<p class="q-sub">${q.sub}</p>` : ''}
      ${helperHtml}
      <div class="options">${optsHtml}</div>
      ${navHtml}
    </div>
  `;
}

function toggleTop(key) {
  if (!state.answers.topIssue) state.answers.topIssue = [];
  const arr = state.answers.topIssue;
  const idx = arr.indexOf(key);
  if (idx !== -1) arr.splice(idx, 1);
  else { if (arr.length >= TOP_ISSUE_Q.maxPicks) arr.pop(); arr.push(key); }
  render();
}
function govNext() { state.step++; window.scrollTo({ top: 0, behavior: 'smooth' }); render(); }
function govAnswer(qid, key) {
  state.answers[qid] = key;
  render();
  setTimeout(() => { govNext(); }, 180);
}
function govBack() {
  if (state.step > 0) { state.step--; window.scrollTo({ top: 0, behavior: 'smooth' }); render(); }
  else go("home");
}
function restartGov() { state.answers = {}; state.step = 0; state.showMethod = false; go("gov"); }

function issueMult(qid) {
  const idx = (state.answers.topIssue || []).indexOf(qid);
  return idx === -1 ? 1 : RANK_MULT[idx];
}

function computeScores() {
  const scores = { becerra: 0, hilton: 0 };
  let max = 0;
  QUESTIONS.forEach(q => {
    const opt = q.options.find(o => o.key === state.answers[q.id]);
    if (!opt) return;
    if (opt.w.becerra === 0 && opt.w.hilton === 0) return; // skip option
    const m = issueMult(q.id);
    CAND_KEYS.forEach(c => { scores[c] += opt.w[c] * m; });
    max += 5 * m;
  });
  const flag = REDFLAG_Q.options.find(o => o.key === state.answers.redflag);
  if (flag && flag.hits) scores[flag.hits] *= REDFLAG_PENALTY;
  const pct = {};
  CAND_KEYS.forEach(c => { pct[c] = max > 0 ? Math.round((scores[c] / max) * 100) : 0; });
  return { scores, max, pct, flag: flag && flag.hits ? flag : null };
}

function renderGovResult() {
  const r = computeScores();
  if (r.max === 0) {
    app.innerHTML = `
      <div class="fade-in">
        <div class="result-head">
          <div class="result-kicker">No match yet</div>
          <h2 class="result-name">Not enough to go on</h2>
          <p class="result-liner">You picked "not sure" on every issue, so there is nothing to compare. The full briefing lays out both candidates side by side.</p>
        </div>
        <div class="briefing-cta"><button class="briefing-cta-btn" onclick="openBriefing()">Read the full voter briefing</button></div>
        <div class="restart-wrap"><button class="restart-btn" onclick="restartGov()">Start Over</button></div>
      </div>`;
    return;
  }
  const tie = r.scores.becerra === r.scores.hilton;
  const topKey = r.scores.becerra >= r.scores.hilton ? "becerra" : "hilton";
  const otherKey = topKey === "becerra" ? "hilton" : "becerra";
  const top = CANDIDATES[topKey], other = CANDIDATES[otherKey];
  const close = !tie && Math.abs(r.pct.becerra - r.pct.hilton) <= 10;

  const duo = CAND_KEYS.map(c => `
    <div class="duo-card ${!tie && c === topKey ? 'top' : ''}">
      <div class="duo-name">${CANDIDATES[c].name}</div>
      <div class="duo-pct">${r.pct[c]}%</div>
      <div class="duo-label">alignment</div>
      <div class="duo-bar"><div class="duo-fill ${CANDIDATES[c].party}" style="width:${r.pct[c]}%"></div></div>
    </div>`).join('');

  // Issue by issue: top-ranked issues first, then the rest in question order.
  const ranked = state.answers.topIssue || [];
  const ordered = QUESTIONS.slice().sort((a, b) => {
    const ia = ranked.indexOf(a.id), ib = ranked.indexOf(b.id);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });
  const issuesHtml = ordered.map(q => {
    const opt = q.options.find(o => o.key === state.answers[q.id]);
    if (!opt) return '';
    const rankIdx = ranked.indexOf(q.id);
    const rankPill = rankIdx !== -1 ? `<span class="pill">Your #${rankIdx + 1} issue</span>` : '';
    const skipped = opt.w.becerra === 0 && opt.w.hilton === 0;
    let closer = null;
    if (!skipped && opt.w.becerra !== opt.w.hilton) closer = opt.w.becerra > opt.w.hilton ? "becerra" : "hilton";
    const stanceHtml = CAND_KEYS.map(c => {
      const isCloser = closer === c && opt.w[c] >= 3;
      return `<div class="stance ${CANDIDATES[c].party} ${isCloser ? 'closer' : ''}"><b>${lastName(CANDIDATES[c].name)}:</b>${isCloser ? '<span class="closer-tag">closer to your answer</span>' : ''} ${q.stance[c]}</div>`;
    }).join('');
    let note = '';
    if (opt.note) note = `<div class="issue-note">${opt.note}</div>`;
    else if (skipped) note = `<div class="issue-note">This answer did not count toward either candidate.</div>`;
    else if (!closer) note = `<div class="issue-note">This answer counted the same for both candidates.</div>`;
    return `
      <div class="issue-row">
        <div class="issue-head"><span class="issue-name">${q.label}</span>${rankPill}</div>
        <div class="issue-pick">You picked <strong>${opt.label.charAt(0).toLowerCase() + opt.label.slice(1)}</strong>.</div>
        ${stanceHtml}
        ${note}
      </div>`;
  }).join('');

  const flagHtml = r.flag ? `<div class="prop-warn"><b>Your dealbreaker:</b> you picked "${r.flag.label.charAt(0).toLowerCase() + r.flag.label.slice(1)}." That applies to ${lastName(CANDIDATES[r.flag.hits].name)}, so his score was cut in half.</div>` : '';

  const headHtml = tie ? `
        <div class="result-kicker">Your Result</div>
        <h2 class="result-name">An even split</h2>
        <p class="result-liner">Your answers lined up equally with both candidates. The issue-by-issue breakdown below shows where each one matched you.</p>`
    : `
        <div class="result-kicker">${close ? 'Your Closer Match' : 'Your Match'}</div>
        <h2 class="result-name">${top.name}</h2>
        <p class="result-liner">${top.oneLiner}</p>
        <span class="party-badge ${top.party}">${partyWord(top.party)}</span>`;

  const caveatHtml = (tie ? CAND_KEYS : [topKey, otherKey]).map(c => `
      <div class="caveat" ${c !== topKey || tie ? 'style="background:#f7f7f5 !important;border-left-color:#5a544a;"' : ''}>
        <div class="caveat-title">${tie || c !== topKey ? 'What to know about ' + lastName(CANDIDATES[c].name) : 'What to know before you vote'}</div>
        <div class="caveat-body">${CAVEATS[c]}</div>
      </div>`).join('');

  app.innerHTML = `
    <div class="fade-in">
      <div class="result-head">
        ${headHtml}
        <div class="duo">${duo}</div>
        ${close ? `<p class="hint">The two scores are within 10 points. Your priorities span both candidates.</p>` : ''}
      </div>

      ${flagHtml}

      <div class="section">
        <div class="section-title">Issue by issue</div>
        ${issuesHtml}
      </div>

      ${caveatHtml}

      <button class="method-toggle" onclick="toggleMethod()">${state.showMethod ? 'Hide' : 'How is your match calculated?'}</button>
      <div class="method-body ${state.showMethod ? 'open' : ''}">
        <p>For each question, both candidates got a score from <strong>0 to 5</strong> for the answer you picked, based on how closely their public record, platform, and stated positions match it.</p>
        <p>The issues you ranked at the start <strong>count extra</strong>: your #1 issue counts double, your #2 counts 1.6 times, and your #3 counts 1.3 times.</p>
        <p>Each candidate's total is divided by the most points possible for the questions you answered. That gives both candidates a 0 to 100 scale. "Not sure" answers are left out.</p>
        <p>The two percentages do not have to add up to 100. On some answers both candidates earn points, because their positions overlap or neither one fully matches what you picked.</p>
        <p>If you named a dealbreaker, the candidate it applies to had his score cut in half.</p>
        <p>This is not a poll, a prediction, or an endorsement. It compares what you said you want with what each candidate has put on the public record.</p>
      </div>

      <div class="briefing-cta">
        <button class="briefing-cta-btn" onclick="beginProps()">Next: the 14 propositions</button>
        <p class="briefing-cta-hint">What each measure does, and a cheat sheet of your picks.</p>
      </div>
      <div class="briefing-link-row">
        <button class="briefing-link" onclick="openBriefing()">Read the full voter briefing →</button>
      </div>

      <div class="restart-wrap">
        <button class="restart-btn" onclick="restartGov()">Start Over</button>
        <button class="restart-btn" style="margin-left:8px;" onclick="go('home')">Home</button>
      </div>
      <p class="footer">This match reflects how your answers line up with each candidate's public record and platform. Not a prediction. Not a recommendation.</p>
    </div>
  `;
}
function toggleMethod() { state.showMethod = !state.showMethod; render(); }

function propDetailHtml(p) {
  return `
      <div class="prop-block" style="border-top:none;padding-top:0;"><div class="prop-label">What it does</div><div class="prop-text">${p.what}</div></div>

function renderProp() {
  const i = state.propIdx;
  const p = PROPS[i];

  const v = state.propVotes[p.num];
  const reviewing = state.propReview !== null;
  app.innerHTML = `
    <div class="fade-in">
      <div class="progress-row">
        <span class="progress-text">Measure ${i + 1} of ${PROPS.length}</span>

      </div>

        <div class="prop-label">Where do you land?</div>

          <button class="vote-btn ${v === 'yes' ? 'sel-yes' : ''}" onclick="propVote(${p.num}, 'yes')">Yes</button>
          <button class="vote-btn ${v === 'no' ? 'sel-no' : ''}" onclick="propVote(${p.num}, 'no')">No</button>
          <button class="vote-btn ${v === 'und' ? 'sel-und' : ''}" onclick="propVote(${p.num}, 'und')">Undecided</button>
        </div>
      </div>
      <div class="nav">
        <button class="back-btn" onclick="propBack()">← ${reviewing ? 'Back to my cheat sheet' : 'Back'}</button>
        <span class="nav-hint">${reviewing ? 'Tap to change your pick' : 'Tap a pick to continue'}</span>
      </div>
      ${reviewing ? '' : `<div class="briefing-link-row"><button class="briefing-link" onclick="go('sheet')">Skip to my cheat sheet →</button></div>`}
    </div>
  `;
}
function propVote(num, v) {
  state.propVotes[num] = v;
  render();
  setTimeout(() => {
    if (state.propReview !== null) { state.propReview = null; go("sheet"); return; }
    if (state.propIdx < PROPS.length - 1) { state.propIdx++; window.scrollTo({ top: 0, behavior: 'smooth' }); render(); }
    else go("sheet");
  }, 180);
}
function propBack() {
  if (state.propReview !== null) { state.propReview = null; go("sheet"); return; }
  if (state.propIdx > 0) { state.propIdx--; window.scrollTo({ top: 0, behavior: 'smooth' }); render(); }
  else go("home");
}
function reviewProp(idx) { state.propIdx = idx; state.propReview = idx; go("props"); }

function renderSheet() {
  const pv = state.propVotes;
  const label = { yes: "Yes", no: "No", und: "Undecided" };
  const rows = PROPS.map((p, idx) => {
    const v = pv[p.num] || "und";
    return `
      <div class="sheet-row">
        <span class="sheet-num">Prop ${p.num}</span>
        <span class="sheet-name">${p.name}<button class="no-print" onclick="reviewProp(${idx})">Review or change</button></span>
        <span class="sheet-pick ${v}">${pv[p.num] ? label[v] : 'No pick'}</span>
      </div>`;
  }).join('');
  let warn = '';
  if (pv[40] === 'yes' && (pv[41] === 'yes' || pv[42] === 'yes')) {
    const which = [41, 42].filter(n => pv[n] === 'yes').map(n => 'Prop ' + n).join(' and ');
    warn = `<div class="prop-warn"><b>Heads up: these picks work against each other.</b> You marked yes on Prop 40 (the billionaire tax) and yes on ${which}. Props 41 and 42 were written to block Prop 40. If either one gets more yes votes than Prop 40, the billionaire tax could be stopped even if it passes. If you want the billionaire tax to take effect, a yes on 41 or 42 cuts against that.</div>`;
  }
  const picked = PROPS.filter(p => pv[p.num]).length;
  app.innerHTML = `
    <div class="fade-in">
      <div class="result-head" style="padding-bottom:20px;">
        <div class="result-kicker">Your Ballot Cheat Sheet</div>
        <h2 class="result-name" style="font-size:clamp(28px,6vw,36px);">14 propositions, your picks</h2>
        <p class="result-liner">${picked} of ${PROPS.length} marked. Screenshot or print this and keep it next to your ballot.</p>
      </div>
      ${warn}
      <div class="section">${rows}</div>
      <div class="briefing-cta no-print">
        <button class="briefing-cta-btn" onclick="window.print()">Print my cheat sheet</button>
        <p class="briefing-cta-hint">Your picks stay on this device. Nothing is saved or sent anywhere.</p>
      </div>
      <div class="restart-wrap no-print">
        <button class="restart-btn" onclick="beginGov()">Governor matcher</button>
        <button class="restart-btn" style="margin-left:8px;" onclick="go('home')">Home</button>
      </div>
      <p class="footer">Summaries draw on the official state voter guide and the Legislative Analyst's Office. This is a study aid, not a recommendation.</p>
    </div>
  `;
}

function togglePrompt() {

  if (body.style.display === 'none') { body.style.display = 'block'; toggle.textContent = 'hide prompt ↑'; }
  else { body.style.display = 'none'; toggle.textContent = 'show the AI prompt ↓'; }
}
function copyPrompt() {
  const text = document.getElementById('promptText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.prompt-copy');
    const original = btn.textContent;
    btn.textContent = 'Copied ✓';
    setTimeout(() => { btn.textContent = original; }, 2000);
  }).catch(() => {
    const range = document.createRange();
    range.selectNode(document.getElementById('promptText'));
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
  });
}

function buildGlossary() {
  const terms = [
    ["ACA", "Affordable Care Act. The federal health insurance law often called Obamacare. Becerra defended it in court as attorney general."],
    ["Bond", "Money the state borrows from investors and repays with interest over many years. A general obligation bond is repaid from the state's main budget. A revenue bond is repaid from a specific income stream, such as loan payments."],
    ["CEQA", "California Environmental Quality Act. Requires review of a project's environmental effects before approval and allows lawsuits over that review. Prop 45 would change it."],
    ["Constitutional amendment", "A change to the state constitution. Only voters can approve one, and the Legislature cannot later undo it without another vote."],
    ["DACA", "Deferred Action for Childhood Arrivals. A federal program protecting people brought to the U.S. as children. Becerra led the coalition of states that defended it."],
    ["General Fund", "The state's main account, which pays for schools, health care, prisons, and most other programs."],
    ["HHS", "U.S. Department of Health and Human Services. Becerra served as Secretary from 2021 to 2025."],
    ["ICE", "U.S. Immigration and Customs Enforcement."],
    ["Initiative", "A measure placed on the ballot by voter signatures instead of by the Legislature."],
    ["LAO", "Legislative Analyst's Office. The Legislature's nonpartisan budget analyst. It writes the fiscal analysis of every measure in the official voter guide."],
    ["Medi-Cal", "California's Medicaid program, which provides health coverage for low-income residents."],
    ["PPIC", "Public Policy Institute of California. A nonpartisan research group whose statewide survey is the main public poll of California voters."],
    ["Prop 13", "The 1978 measure capping property taxes and requiring a two-thirds vote for many local taxes. Prop 43 concerns how that two-thirds rule applies."],
    ["Prop 36", "The 2024 measure that increased penalties for certain drug and theft crimes and created a treatment-mandated felony option. Becerra voted for it and says he would fully fund it."],
    ["Rainy day fund", "The state's main budget reserve, formally the Budget Stabilization Account. Prop 2 would double its target size."],
    ["Sanctuary law (SB 54)", "The California Values Act of 2017. It limits how much state and local police can help with federal immigration enforcement. Becerra would keep it; Hilton would overturn it."],
    ["Special tax", "A tax whose money is set aside for a specific purpose, as opposed to a general tax that can pay for anything."],
    ["State spending limit", "A 1979 constitutional cap on how much tax money the state can spend each year, also called the Gann Limit. Props 2 and 41 both touch it."],
    ["Top-two primary", "California's primary format. All candidates appear on one ballot and the top two advance to November, even if they are from the same party."],
    ["Voter's Choice Act", "A state law that lets counties replace neighborhood polling places with vote centers that open days before the election. Many counties use it."]
  ];
  return terms.map(([t, d]) => `<div class="gloss-term"><strong>${t}.</strong> ${d}</div>`).join('');
}

function buildEconContext() {
  let html = '';
  html += `<h1>Economic Context: Supplementary Reference</h1>`;
  html += `<p class="lead">The side-by-side tables on the landing page show what changed between the end of 2024 and fall 2026. This section adds context: why AI investment is a mixed bag, what the key terms mean, and where the data comes from.</p>`;

  html += `<div class="section-kicker">Part A: The AI Question</div>`;
  html += `<h2>Why AI investment is both a positive and a negative</h2>`;
  html += `<p class="lead">Headline economic numbers (GDP, the stock market, venture capital) have been propped up by AI infrastructure investment. But AI's costs to electricity bills, water supplies, land use, and employment are not captured in those same numbers. A fair accounting includes both.</p>`;
  html += `<h3>What AI is adding</h3>`;
  html += `<p>AI data center construction and chip manufacturing have driven hundreds of billions of dollars in investment. That creates construction jobs, generates tax revenue for some host communities, and is a major reason U.S. growth has held up despite headwinds elsewhere. California is the center of it: California firms raised about $366 billion in venture capital in 2026 through August, more than three times the other 49 states combined.</p>`;
  html += `<h3>What AI is costing</h3>`;
  html += `<div class="econ-callout-box"><span class="econ-callout-box-label">Electricity</span>U.S. data centers consume about 4.4% of all U.S. electricity, up from 1.9% in 2018, and could reach 12% by 2028. The national average home electricity price was 18.31 cents per kilowatt-hour in July 2026, up 4.9% in a year. Federal energy analysts attribute rising rates partly to grid spending for data center demand.</div>`;
  html += `<div class="econ-callout-box"><span class="econ-callout-box-label">Water</span>Large data centers can consume up to 5 million gallons of water per day, about as much as a town of 10,000 to 50,000 people.</div>`;
  html += `<div class="econ-callout-box"><span class="econ-callout-box-label">Employment</span>Employers announced 116,175 job cuts attributed to AI from January through August 2026, about 22% of all announced cuts, according to Challenger, Gray &amp; Christmas. Bay Area tech layoff notices through early September were 27% higher than in all of 2025.</div>`;
  html += `<h3>Why this matters for voting</h3>`;
  html += `<p>Different policies push AI's costs onto different groups:</p>`;
  html += `<ul>
    <li><strong>Tax incentives</strong> for data centers shift costs from corporations to residents.</li>
    <li><strong>Utility rate rules</strong> decide whether households subsidize data center power use.</li>
    <li><strong>Worker retraining and unemployment insurance</strong> decide the safety net for people displaced by automation.</li>
    <li><strong>Environmental review</strong> rules, including Prop 45 on this ballot, decide how much scrutiny large projects get.</li>
  </ul>`;
  html += `<p>On AI, Becerra calls for enforcement and audits. Hilton has declined to back specific regulations.</p>`;

  html += `<div class="section-kicker">Part B: Glossary</div>`;
  html += `<h2>Economic terms</h2>`;
  const glossary = [
    ['CPI (Consumer Price Index)', 'The main measure of inflation in the U.S. Tracks the average change in prices for a basket of everyday goods and services: food, gas, rent, medical care, clothing. Published monthly by the Bureau of Labor Statistics.'],
    ['Year over year', 'A comparison between a number today and the same number 12 months ago. "Gas prices up 27% year over year" means gas costs 27% more than it did one year ago.'],
    ['GDP (Gross Domestic Product)', 'The total dollar value of all goods and services produced. Growth of 2 to 3% a year is generally considered healthy.'],
    ['Fed funds rate', 'The interest rate the Federal Reserve sets for banks lending to each other overnight. It influences almost every other interest rate: mortgages, credit cards, car loans. Higher rates cool inflation but slow the economy. The Fed raised it in September 2026.'],
    ['30-year mortgage rate', 'The average interest rate on a 30-year fixed home loan. A 1-point change can mean hundreds of dollars a month in payments.'],
    ['Unemployment rate', 'The percentage of people in the labor force who do not have a job but are looking for one. It does not count people who have stopped looking.'],
    ['Monthly job growth', 'The net number of jobs added each month. 150,000 to 200,000 a month has historically been considered healthy; under 50,000 suggests a weakening labor market.'],
    ['Tariffs', 'Taxes on imported goods. The Supreme Court struck down the emergency-powers tariffs in February 2026.'],
    ['Venture capital', 'Money invested in early-stage or fast-growing companies. When most of it flows to one region, that region captures most new-company formation.'],
    ['Strait of Hormuz', 'A narrow waterway in the Persian Gulf that carries a large share of the world\'s oil. Disruption of shipping during the 2026 U.S.-Iran conflict drove oil and U.S. fuel prices sharply higher.']
  ];
  glossary.forEach(([term, def]) => {
    html += `<div class="econ-glossary-item"><span class="econ-glossary-term">${term}</span><div class="econ-glossary-def">${def}</div></div>`;
  });

  html += `<div class="section-kicker">Part C: Sources and Method</div>`;
  html += `<h2>Where the economic data comes from</h2>`;
  html += `<p>The "Latest 2026" figures were compiled on ${DATA_DATE} and reflect the most recent release for each measure, mostly August 2026. The 2024 column is the end-of-2024 baseline from the original version of this reference.</p>`;
  html += `<ul>
    <li>U.S. Bureau of Labor Statistics (inflation, food prices, unemployment, jobs)</li>
    <li>Freddie Mac Primary Mortgage Market Survey (mortgage rates)</li>
    <li>AAA (gas and diesel prices)</li>
    <li>National Association of Realtors (home prices and sales)</li>
    <li>Federal Reserve (interest rates and projections)</li>
    <li>Bureau of Economic Analysis (GDP)</li>
    <li>U.S. Census Bureau (household income)</li>
    <li>U.S. Energy Information Administration (electricity prices)</li>
    <li>Challenger, Gray &amp; Christmas (announced job cuts)</li>
    <li>American Farm Bureau Federation (farm costs)</li>
    <li>California Employment Development Department (state unemployment and jobs)</li>
    <li>Zillow (California home values)</li>
    <li>Federal Reserve Bank of St. Louis FRED (building permits, state unemployment history)</li>
    <li>California Legislative Analyst's Office (state budget)</li>
  </ul>`;
  html += `<h3>A note on "better" and "worse"</h3>`;
  html += `<p>The labels reflect the effect on household affordability, job availability, and cost of living. Rising home prices are labeled "Worse" because they make homes less affordable for buyers. Rising gas, grocery, or energy prices are labeled "Worse" because they reduce what a paycheck buys.</p>`;
  html += `<h3>What this reference does not cover</h3>`;
  html += `<p>This reference does not assess specific candidates, rank parties, or predict elections. It compares economic indicators at two points in time.</p>`;
  return html;
}
